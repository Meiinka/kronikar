<script>
/* ================= auto-save to a folder on disk (File System Access API) =================
   Folder layout (version 2, Kronikár 1.7+):
     <folder>/<book>/projekt.json        title, structure of parts/chapters/scenes, export settings, goals
     <folder>/<book>/rukopis/<id>.html   text of one scene (plain HTML, readable without Kronikár)
     <folder>/<book>/svet.json           world entries, relationships, custom categories
     <folder>/<book>/poznamky.json       sticky notes
     <folder>/<book>/statistiky.json     words written per day (merged automatically)
     <folder>/<book>/obrazky/<id>.jpg   photos and maps of world entries (never change once written)
     <folder>/<book>/verzie/<scene>--<id>.html  saved versions of scenes (never change once written)
     <folder>/<book>/citatelne/          readable copy of the whole book, world and notes (never read back)
     <folder>/zalohy/                    one full backup per book and day

   that really changed are written, and a conflict is reported for the one part changed on both sides. */
const idb = {
  db: null,
  open() { return this.db || (this.db = new Promise((res, rej) => { const r = indexedDB.open("kronikar", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
  async run(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction("kv", mode), st = tx.objectStore("kv"), r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); },
  get(k) { return this.run("readonly", s => s.get(k)); },
  set(k, v) { return this.run("readwrite", s => s.put(v, k)); },
  del(k) { return this.run("readwrite", s => s.delete(k)); },

/* ---------- parts of a book ---------- */
const hash = s => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36) + "." + s.length; };

const canon = v => JSON.stringify(sortKeys(v), null, 1);
const SYNC_SKIP_KEYS = ["sprints", "updated", "words", "entCount", "links", "customCats", "graphPos", "stickies", "noteCats", "dayStart", "history", "id"];
const cleanBinder = nodes => (nodes || []).map(n => { const { words, chars, open, ...r } = n; if (r.children) r.children = cleanBinder(r.children); return r; });
const textNodes = (nodes, acc = []) => { (nodes || []).forEach(n => { if (n.type === "text") acc.push(n); if (n.children) textNodes(n.children, acc); }); return acc; };
const SCENE_RE = /^rukopis\/([^/]+)\.html$/;
function sceneHtml(node, item, lang) {
  const t = esc(node.title || "");
  return `<!doctype html>\n<html lang="${lang}"><head><meta charset="utf-8"><meta name="kronikar-scene" content="${esc(node.id)}"><title>${t}</title>\n<style>body{font-family:Georgia,serif;max-width:40em;margin:2em auto;line-height:1.6;padding:0 1em}aside{border-top:1px solid #ccc;margin-top:2em;color:#555;white-space:pre-wrap;font-family:sans-serif;font-size:.9em}</style></head>\n<body>\n<h1>${t}</h1>\n<article>\n${item.html || ""}\n</article>\n<aside id="kronikar-notes">${esc(item.notes || "")}</aside>\n</body>\n</html>\n`;
}
function parseScene(text) {

  return { html: a.innerHTML.trim(), notes: d.querySelector("#kronikar-notes")?.textContent || "" };
}
/* local data of a book → { path: text } */
function bookParts(id, doc, items, ents) {
  const proj = {}; Object.keys(doc).forEach(k => { const v = doc[k]; if (SYNC_SKIP_KEYS.includes(k) || v === undefined || (v && typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length)) return; proj[k] = v; });
  /* default note categories are not a change */
  const nc = doc.noteCats, isDefNc = Array.isArray(nc) && nc.length === NOTE_CATS_DEFAULT.length && nc.every((c, i) => { const d = NOTE_CATS_DEFAULT[i]; return c.id === d.id && c.color === d.color && (c.name === d.name || c.name === (I18N.tr(d.name) ?? d.name)); });
  proj.binder = cleanBinder(doc.binder);

    "projekt.json": canon({ format: "kronikar-projekt", version: 2, id, project: proj }),
    "svet.json": canon({ format: "kronikar-svet", version: 2, id, ents: Object.fromEntries(Object.values(ents).map(e => { const { id: x, ...r } = e; return [x, r]; })), links: doc.links || [], customCats: doc.customCats || [] }),
    "poznamky.json": canon({ format: "kronikar-poznamky", version: 2, id, stickies: doc.stickies || [], noteCats: isDefNc ? null : (nc || null) }),
    "statistiky.json": canon({ format: "kronikar-statistiky", version: 2, id, history: doc.history || {}, ...(doc.sprints && doc.sprints.length ? { sprints: doc.sprints } : {}) }),

}
/* apply remote parts { path: text } onto local data { doc, items, ents } (mutates, returns changed kinds) */
function applyParts(D, parts) {
  const ch = new Set();

    try {
      const m = path.match(SCENE_RE);
      if (m) { const s = parseScene(text); if (s) { D.items[m[1]] = { id: m[1], html: s.html, notes: s.notes }; ch.add("item:" + m[1]); } continue; }
      const j = JSON.parse(text);
      if (path === "projekt.json") { const keep = {}; SYNC_SKIP_KEYS.forEach(k => { if (k in D.doc) keep[k] = D.doc[k]; }); D.doc = Object.assign(defaultProject(), j.project, keep); ch.add("project"); }

}
function syncPartLabel(path, doc) {
  const m = path.match(SCENE_RE);

  return { "projekt.json": tl("štruktúre rukopisu a nastaveniach"), "svet.json": tl("svete"), "poznamky.json": tl("poznámkach"), "statistiky.json": tl("štatistikách") }[path] || path;
}
const CONFLICT_RE = /\.sync-conflict-\d{8}-\d{6}-[A-Z0-9]{7}/i;

const Sync = {
  supported: typeof window.showDirectoryPicker === "function",
  dir: null, name: "", state: "none", last: 0, err: null, timer: null, busy: null,
  books: {},          /* pid → { dir, base: {path: hash}, seen: {path: mtime} } */
  conflicts: [],      /* legacy root-level Syncthing conflicts (1.6 single files) */
  parts: [],          /* part conflicts: { pid, path, text, file?, at } */
  homeNotes: {},      /* pid → number of unresolved Syncthing conflicts (shown on the home screen) */
  polling: false, lastPoll: 0, readableAt: {},
  async init() {
    if (window.AndroidFS) { try { if (AndroidFS.hasFolder()) { this.dir = window.__androidDir(); this.name = AndroidFS.folderName(); this.state = "ok"; } } catch (e) { console.warn(e); } return; }

    try {
      const h = await idb.get("dir"); if (!h) return;
      this.dir = h; this.name = h.name;
      this.state = (await h.queryPermission({ mode: "readwrite" })) === "granted" ? "ok" : "need";
    } catch (e) { console.warn("sync init", e); }
  },
  async pick() {
    try {
      const h = await window.showDirectoryPicker({ id: "kronikar", mode: "readwrite" });
      await idb.set("dir", h).catch(() => { });
      this.dir = h; this.name = h.name; this.state = "ok"; this.books = {};
      for (const p of S.projects) await Store.del("meta/sync/" + p.id).catch(() => { });
      const n = await this.pull();
      await this.pushAll();
      toast(n ? `Načítané z priečinka: ${n} ${plural(n, "projekt", "projekty", "projektov")}.` : "Priečinok je prepojený, projekty sa doň ukladajú automaticky.");
    } catch (e) { if (e && e.name !== "AbortError") { console.error(e); toast("Priečinok sa nepodarilo prepojiť."); } }

  },
  async grant() {
    try {
      this.state = (await this.dir.requestPermission({ mode: "readwrite" })) === "granted" ? "ok" : "need";

  },
  async disconnect() { await idb.del("dir").catch(() => { }); this.dir = null; this.name = ""; this.state = "none"; this.books = {}; render(); },
  async write(dir, name, text) { const fh = await dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(text); await w.close(); return fh; },
  async readJSON(h) { const f = await h.getFile(); return { f, data: JSON.parse(await f.text()) }; },
  isConflict: name => CONFLICT_RE.test(name),
  mergeTemplates(list) {

  },
  /* run one sync operation at a time */
  serial(fn) { const run = (this.busy || Promise.resolve()).then(fn, fn); this.busy = run.catch(() => { }); return run; },
  /* ---------- per-book state ---------- */

  },
  saveBook(pid) { const b = this.books[pid]; if (b) Store.set("meta/sync/" + pid, { dir: b.dir, base: b.base }).catch(() => { }); },
  async bookDir(pid, title, create) {

  async removePath(dir, path) { try { const { d, name } = await this.sub(dir, path, false); await d.removeEntry(name); } catch { } },
  /* list files of a book: { path: { h, lm } } and Syncthing conflict copies */
  async listBook(dir) {

  },
  /* local data of a project: the open one from memory, others from storage */
  async localData(pid) {
    if (S.p && S.p.id === pid) { if (typeof flushEditor === "function") flushEditor(); return { open: true, doc: projDoc(S.p), items: Object.assign({}, S.items), ents: Object.assign({}, S.ents) }; }

  },
  /* store merged data back (memory for the open project, storage for all) */

  /* show remote changes in the open project without disturbing the scene being written */

  const conf = Sync.state === "ok" && Sync.conflicts.length ? `<div class="notice warn sync" style="flex-direction:column;align-items:stretch"><span><b>Syncthing našiel ${Sync.conflicts.length} ${plural(Sync.conflicts.length, "konfliktnú verziu", "konfliktné verzie", "konfliktných verzií")}.</b> Vznikajú, keď sa ten istý projekt upraví na dvoch zariadeniach naraz. Môžeš ich načítať ako samostatný projekt a porovnať, alebo zahodiť.</span>${Sync.conflicts.map(c => `<div class="btnrow" style="align-items:center"><span style="flex:1;min-width:0">${esc(c.title || c.name)} <small class="muted">${relTime(c.when)}</small></span><button class="btn sm" data-cfkeep="${esc(c.name)}">Načítať ako kópiu</button><button class="btn sm ghost danger" data-cfdrop="${esc(c.name)}">Zahodiť</button></div>`).join("")}</div>` : "";
  const pend = Sync.state === "ok" ? Object.keys(Sync.homeNotes).map(pid => S.projects.find(p => p.id === pid)).filter(Boolean) : [];
  const pendHtml = pend.length ? `<div class="notice warn sync"><span style="flex:1"><b>${esc(tl("Nevyriešený konflikt v projekte"))} ${pend.map(p => "„" + esc(p.title) + "“").join(", ")}.</b> ${esc(tl("Otvor projekt – ukáže, ktorá časť sa líši, a vyberieš si verziu."))}</span></div>` : "";
  if (Sync.state === "ok") return conf + pendHtml + `<div class="notice sync ok"><span class="sdot"></span><span style="flex:1"><b>Automaticky ukladám do priečinka „${esc(Sync.name)}“.</b> ${esc(tl("Každá kniha má vlastný podpriečinok: rukopis po scénach, svet a poznámky zvlášť a čitateľnú kópiu v podpriečinku citatelne. Raz denne sa pridá záloha do zalohy a zmeny z iných zariadení (napr. cez Syncthing) sa načítajú samy."))}${Sync.last ? " Naposledy uložené " + new Date(Sync.last).toLocaleTimeString(LANG === "en" ? "en-US" : "sk-SK", { hour: "2-digit", minute: "2-digit" }) + "." : ""}</span><span class="btnrow"><button class="btn sm" id="syncPick">Zmeniť priečinok</button><button class="btn sm ghost" id="syncOff">Odpojiť</button></span></div>`;
  if (Sync.state === "need") return `<div class="notice warn sync"><span style="flex:1"><b>Prehliadač potrebuje znova povoliť ukladanie do priečinka „${esc(Sync.name)}“.</b> Stačí kliknúť – bez toho sa zmeny ukladajú len do prehliadača.</span><span class="btnrow"><button class="btn sm primary" id="syncGrant">Povoliť prístup</button><button class="btn sm ghost" id="syncOff">Odpojiť</button></span></div>`;
  return `<div class="notice warn sync"><span style="flex:1"><b>Zapni automatické ukladanie do súboru.</b> Vyber priečinok (napr. v Dokumentoch alebo na OneDrive) a Kronikár doň po každej zmene uloží celý projekt. Keď otvoríš appku v inom prehliadači alebo počítači a vyberieš ten istý priečinok, projekty sa načítajú.</span><span class="btnrow"><button class="btn sm primary" id="syncPick">Vybrať priečinok</button></span></div>`;
}
function bindSyncCard() {
  $("#syncPick")?.addEventListener("click", () => Sync.pick());
  $("#syncGrant")?.addEventListener("click", () => Sync.grant());
  $("#syncOff")?.addEventListener("click", () => Sync.disconnect());
  $$("[data-cfkeep]").forEach(b => b.onclick = () => Sync.resolveConflict(b.dataset.cfkeep, true));
  $$("[data-cfdrop]").forEach(b => b.onclick = () => Sync.resolveConflict(b.dataset.cfdrop, false));
}
</script>
