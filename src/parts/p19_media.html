<script>
/* ================= pictures: photos of world entries, maps with pins =================
   Pictures are stored on this device in IndexedDB (key img/<id>) and in the book folder as
   <book>/obrazky/<id>.jpg. A picture never changes after upload (a new one gets a new id), so it
   cannot conflict; svet.json only keeps the ids: e.photos = [{id,w,h,cap}], e.map = {img,w,h,pins:[{id,x,y,ent}]}. */
Object.assign(I, {
  refresh: '<svg viewBox="0 0 16 16"><path d="M13.2 6.2A5.4 5.4 0 0 0 3.1 5M2.8 9.8A5.4 5.4 0 0 0 12.9 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13.6 2.6v3.8H9.8M2.4 13.4V9.6h3.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  pin: '<svg viewBox="0 0 16 16"><path d="M8 14.5s-4.5-4.6-4.5-8a4.5 4.5 0 0 1 9 0c0 3.4-4.5 8-4.5 8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="8" cy="6.5" r="1.6" fill="currentColor"/></svg>',
  img: '<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="6.5" r="1.2" fill="currentColor"/><path d="M2.5 12l3.5-3.5 2.5 2.5 2-2 3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
});
const IMG = {
  urls: {},
  key: id => "img/" + id,
  async put(id, blob) { await idb.set(this.key(id), blob); },
  async local(id) { try { return (await idb.get(this.key(id))) || null; } catch { return null; } },
  async blob(id) {
    let b = await this.local(id); if (b) return b;
    b = S.p ? await Sync.readImage(S.p.id, id).catch(() => null) : null;   /* uploaded on another device */
    if (b) await this.put(id, b).catch(() => { });
    return b;
  },
  async url(id) { if (this.urls[id]) return this.urls[id]; const b = await this.blob(id); if (!b) return null; return (this.urls[id] = URL.createObjectURL(b)); },
  async del(id) { try { await idb.del(this.key(id)); } catch { } if (this.urls[id]) { URL.revokeObjectURL(this.urls[id]); delete this.urls[id]; } },
};
function entImageIds(ents) {
  const s = new Set();
  Object.values(ents || {}).forEach(e => { (e.photos || []).forEach(p => p.id && s.add(p.id)); if (e.map?.img) s.add(e.map.img); });
  return s;
}
function hydrateImgs(root) {
  $$("img[data-img]", root).forEach(async im => { const u = await IMG.url(im.dataset.img); if (u) { im.src = u; im.closest(".missing")?.classList.remove("missing"); } else im.parentElement?.classList.add("missing"); });
  $$("[data-bgimg]", root).forEach(async el => { const u = await IMG.url(el.dataset.bgimg); if (u) el.style.backgroundImage = `url("${u}")`; });
}
async function prepImage(file, max, q) {
  let src;
  try { src = await createImageBitmap(file); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(tl("Tento obrázok sa nedá načítať (skús JPG alebo PNG)."))); i.src = URL.createObjectURL(file); }); }
  const w0 = src.width, h0 = src.height, k = Math.min(1, max / Math.max(w0, h0)), w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.imageSmoothingQuality = "high"; x.drawImage(src, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
  if (!blob) throw new Error(tl("Tento obrázok sa nedá načítať (skús JPG alebo PNG)."));
  return { blob, w, h };
}
async function addImage(file, max = 1600, q = .85) {
  const r = await prepImage(file, max, q), id = uid("i");
  await IMG.put(id, r.blob);
  if (S.p) Sync.putImage(S.p.id, id, r.blob);
  return { id, w: r.w, h: r.h };
}
function dropImage(id) { if (!id) return; IMG.del(id); if (S.p) Sync.removeImage(S.p.id, id); }
function pickFiles(multiple) {
  return new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.multiple = !!multiple; i.style.display = "none"; document.body.appendChild(i); i.onchange = () => { res([...i.files]); i.remove(); }; i.click(); });
}
const isImageFile = f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name || "");
function bindDrop(el, fn) {
  el.ondragover = ev => { if ([...(ev.dataTransfer?.items || [])].some(i => i.kind === "file")) { ev.preventDefault(); el.classList.add("drag"); } };
  el.ondragleave = ev => { if (!el.contains(ev.relatedTarget)) el.classList.remove("drag"); };
  el.ondrop = ev => { const f = [...(ev.dataTransfer?.files || [])].filter(isImageFile); el.classList.remove("drag"); if (!f.length) return; ev.preventDefault(); fn(f); };
}

/* ---------- folder sync of pictures ---------- */
Object.assign(Sync, {
  imgPath: id => "obrazky/" + id + ".jpg",
  async writeBin(dir, path, blob) { const { d, name } = await this.sub(dir, path, true); const fh = await d.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(blob); await w.close(); },
  async putImage(pid, id, blob) {
    if (this.state !== "ok" || !pid) return;
    try { const dir = await this.bookDir(pid, S.p && S.p.id === pid ? S.p.title : "", true); await this.writeBin(dir, this.imgPath(id), blob); }
    catch (e) { console.warn("image write", e); }
  },
  async readImage(pid, id) {
    if (this.state !== "ok" || !pid) return null;
    const dir = await this.bookDir(pid, "", false); if (!dir) return null;
    const { d, name } = await this.sub(dir, this.imgPath(id), false);
    const f = await (await d.getFileHandle(name)).getFile();
    return f instanceof Blob ? f : await f.blob();
  },
  async removeImage(pid, id) {
    if (this.state !== "ok" || !pid) return;
    try { const dir = await this.bookDir(pid, "", false); if (dir) await this.removePath(dir, this.imgPath(id)); } catch { }
  },
  /* pictures added while no folder was connected (or before 1.9) go to the folder on the next full sync */
  async syncImages(pid, dir, ents) {
    const want = entImageIds(ents); if (!want.size) return;
    const have = new Set();
    try { const d = await dir.getDirectoryHandle("obrazky"); for await (const [name] of d.entries()) have.add(name); } catch { }
    for (const id of want) {
      if (have.has(id + ".jpg")) continue;
      const b = await IMG.local(id);
      if (b) await this.writeBin(dir, this.imgPath(id), b).catch(e => console.warn("image write", e));
    }
  },
});
async function backupImages(ents) {
  const out = {};
  for (const id of entImageIds(ents)) { const b = await IMG.blob(id).catch(() => null); if (b) out[id] = await blobToB64(b); }
  return out;
}
async function restoreImages(images) {
  for (const [id, b64] of Object.entries(images || {})) {
    if (await IMG.local(id)) continue;
    const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    await IMG.put(id, new Blob([u], { type: "image/jpeg" })).catch(() => { });
  }
}

/* ---------- photos of an entry ---------- */
function mountPhotos(el, e) {
  if (!el) return;
  const ph = e.photos || [];
  el.innerHTML = `<h3>Fotografie <span class="mono" style="letter-spacing:0">${ph.length || ""}</span><span class="spacer"></span>${ph.length ? `<button class="btn sm ghost" data-phadd>${I.plus}Pridať</button>` : ""}</h3>
    ${ph.length ? `<div class="phgrid">${ph.map((p, i) => `<button class="phth" data-ph="${i}" title="${esc(p.cap || "")}"><img data-img="${p.id}" alt="${esc(p.cap || "")}">${i === 0 && ph.length > 1 ? `<span class="phmain">Hlavná</span>` : ""}</button>`).join("")}</div>`
      : `<button class="phdrop" data-phadd>${I.img}<span>Pridaj fotky alebo obrázky – podobu postavy, miesto, erb, inšpiráciu. Na počítači ich sem môžeš aj pretiahnuť.</span></button>`}`;
  hydrateImgs(el);
  $$("[data-phadd]", el).forEach(b => b.onclick = async () => addPhotos(e, await pickFiles(true)));
  $$("[data-ph]", el).forEach(b => b.onclick = () => openLightbox(e, +b.dataset.ph));
  bindDrop(el, f => addPhotos(e, f));
}
function refreshEntPhotos(e) {
  if (S.mode !== "world" || S.ent !== e.id) return;
  mountPhotos($("#ePhotos"), e);
  const av = $("#eAv"); if (av) { av.innerHTML = e.photos?.length ? `<img data-img="${e.photos[0].id}" alt="">` : I.img; av.classList.toggle("has", !!e.photos?.length); hydrateImgs(av); }
  renderEList();
}
async function addPhotos(e, files) {
  files = (files || []).filter(isImageFile); if (!files.length) return;
  toast(tl("Pridávam fotky…"));
  e = S.ents[e.id] || e;
  let n = 0;
  for (const f of files) { try { const r = await addImage(f, 1600, .85); (e.photos = e.photos || []).push({ id: r.id, w: r.w, h: r.h, cap: "" }); n++; } catch (err) { console.warn(err); toast(err.message || tl("Tento obrázok sa nedá načítať (skús JPG alebo PNG).")); } }
  if (!n) return;
  saveEnt(e.id); refreshEntPhotos(e);
  toast(tl("Pridané fotky: {x}").replace("{x}", n));
}
function openLightbox(e, i) {
  document.querySelector(".lightbox")?.remove();
  const ov = document.createElement("div"); ov.className = "lightbox"; ov.setAttribute("role", "dialog"); document.body.appendChild(ov);
  let conf = false;
  const key = ev => { if (ev.target.closest?.(".lbcap")) { if (ev.key === "Escape") close(); return; } if (ev.key === "Escape") close(); else if (ev.key === "ArrowLeft") go(-1); else if (ev.key === "ArrowRight") go(1); };
  const close = () => { ov.remove(); document.removeEventListener("keydown", key); refreshEntPhotos(e); };
  const go = d => { const n = (e.photos || []).length; if (n < 2) return; i = (i + d + n) % n; conf = false; draw(); };
  const draw = () => {
    const ph = e.photos || []; if (!ph.length) return close();
    i = Math.max(0, Math.min(i, ph.length - 1)); const p = ph[i];
    ov.innerHTML = `<div class="lbtop"><span class="lbn">${esc(e.name || "")}${ph.length > 1 ? ` · ${i + 1} / ${ph.length}` : ""}</span><span class="spacer"></span>
        ${i > 0 ? `<button class="btn sm" data-lb="main">Nastaviť ako hlavnú</button>` : ""}
        ${conf ? `<button class="btn sm danger solid" data-lb="delyes">Zmazať fotku</button><button class="btn sm" data-lb="delno">Ponechať</button>` : `<button class="btn sm" data-lb="del">${I.trash}Zmazať</button>`}
        <button class="btn icon" data-lb="close" aria-label="Zavrieť">×</button></div>
      <div class="lbimg">${ph.length > 1 ? `<button class="lbnav prev" data-lb="prev" aria-label="Predchádzajúca">‹</button>` : ""}<img data-img="${p.id}" alt="">${ph.length > 1 ? `<button class="lbnav next" data-lb="next" aria-label="Ďalšia">›</button>` : ""}</div>
      <div class="lbbot"><input class="inp lbcap" placeholder="Popis fotky (voliteľné)" value="${esc(p.cap || "")}"></div>`;
    hydrateImgs(ov);
    const cap = $(".lbcap", ov), sv = debounce(() => saveEnt(e.id), 500);
    cap.oninput = () => { p.cap = cap.value; sv(); };
    $$("[data-lb]", ov).forEach(b => b.onclick = ev => {
      ev.stopPropagation(); const a = b.dataset.lb;
      if (a === "close") close(); else if (a === "prev") go(-1); else if (a === "next") go(1);
      else if (a === "main") { ph.unshift(ph.splice(i, 1)[0]); i = 0; saveEnt(e.id); draw(); }
      else if (a === "del") { conf = true; draw(); } else if (a === "delno") { conf = false; draw(); }
      else if (a === "delyes") { const [x] = ph.splice(i, 1); dropImage(x.id); conf = false; saveEnt(e.id); if (!ph.length) close(); else draw(); }
    });
    const box = $(".lbimg", ov); let sx = null;
    box.onpointerdown = ev => { sx = ev.clientX; };
    box.onpointerup = ev => { if (sx !== null && Math.abs(ev.clientX - sx) > 50) go(ev.clientX < sx ? 1 : -1); else if (ev.target === box) close(); sx = null; };
  };
  document.addEventListener("keydown", key);
  draw();
}

/* ---------- where an entry appears in the manuscript (shared by the world detail and map pins) ---------- */
function entOccurrences(e) {
  const occ = []; let total = 0;
  allTexts().forEach(n => {
    const why = [];
    if (n.pov === e.id) why.push("rozprávač"); else if (nodePovs(n).includes(e.id)) why.push(tl("pohľad kapitoly")); if (n.place === e.id) why.push("miesto deja"); if ((n.ents || []).includes(e.id)) why.push("priradené");
    const m = e.name && e.name.trim().length > 1 ? findMentions(e, S.items[n.id]?.html) : null;
    if (m) { why.push("v texte " + m.count + "×"); total += m.count; }
    if (why.length) occ.push({ n, why, snip: m ? m.snippet : "", assigned: n.place === e.id || (n.ents || []).includes(e.id) });
  });
  return { occ, total };
}
function sceneChapterTitle(n) { const f = findNode(n.id); return f && f.parent ? f.parent.title : ""; }
function assignOptions() {
  return bookStructure().filter(s => s.type === "chapter").map(s => {
    if (s.loose) return `<optgroup label="${esc(s.node.title || tl("Bez názvu"))}">${s.texts.map(t => `<option value="${t.id}">${esc(t.title || tl("Bez názvu"))}</option>`).join("")}</optgroup>`;
    const lab = (chapLabel(s.n) ? chapLabel(s.n) + ": " : s.n + ". ") + s.title;
    if (s.texts.length === 1 && s.node && s.node.type === "text") return `<option value="${s.texts[0].id}">${esc(lab)}</option>`;
    return `<optgroup label="${esc(lab)}"><option value="ch:${s.n}">${esc(tl("Celá kapitola"))}</option>${s.texts.map(t => `<option value="${t.id}">${esc(t.title || tl("Bez názvu"))}</option>`).join("")}</optgroup>`;
  }).join("");
}
function assignEnt(entId, val) {
  const e = S.ents[entId]; if (!e || !val) return 0;
  const st = bookStructure();
  const texts = val.startsWith("ch:") ? (st.find(s => s.type === "chapter" && s.n === +val.slice(3))?.texts || []) : [findNode(val)?.n].filter(Boolean);
  let n = 0;
  texts.forEach(t => {
    if (t.place === entId || t.pov === entId || (t.ents || []).includes(entId)) return;
    if (e.cat === "krajina" && !t.place) t.place = entId; else t.ents = [...(t.ents || []), entId];
    n++;
  });
  if (n) saveProject();
  return n;
}
function unassignEnt(entId, sceneId) {
  const t = findNode(sceneId)?.n; if (!t) return;
  if (t.place === entId) t.place = null;
  t.ents = (t.ents || []).filter(x => x !== entId);
  saveProject();
}
function goScene(id) { S.sel = id; S.mode = "write"; $$("[data-mode]").forEach(x => x.classList.toggle("on", x.dataset.mode === "write")); renderMode(); }
