<script>
/* ================= render: shell ================= */
function render() { const app = $("#app"); if (S.view === "home") renderHome(app); else renderProject(app); }
render.loading = msg => { $("#app").innerHTML = '<div class="loading">' + esc(msg) + "</div>"; };
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function renderHome(app) {
  const cloud = Store.mode === "cloud";
  const cards = S.projects.map(p => {
    const goal = p.goals?.total || 0, pct = goal ? Math.min(100, (p.words || 0) / goal * 100) : 0;
    const conf = S.confirm && S.confirm.type === "project" && S.confirm.id === p.id;
    return `<div class="pcard" data-open="${esc(p.id)}" role="button" tabindex="0" aria-label="Otvoriť ${esc(p.title)}">
      <span class="spine" style="background:var(--accent)"></span>
      <div class="genre">${esc(p.genre || "Román")}</div>
      <h3>${esc(p.title)}</h3>
      ${p.author ? `<div class="muted" style="font-size:13px">${esc(p.author)}</div>` : ""}
      ${conf ? `<div class="confirm" data-stop><b>Zmazať „${esc(p.title)}“ natrvalo?</b><span>Zmaže sa celý rukopis aj svet. Ak si nie si istá, najprv si stiahni zálohu.</span><div class="btnrow"><button class="btn sm danger solid" data-delproj="${esc(p.id)}">Zmazať</button><button class="btn sm" data-cancel>Ponechať</button></div></div>` : ""}
      <div class="stats"><span><b>${nf(p.words)}</b> slov</span><span><b>${nf(p.entCount)}</b> ${plural(p.entCount || 0, "záznam", "záznamy", "záznamov")} sveta</span><span>${relTime(p.updated)}</span></div>
      ${goal ? `<div class="bar" title="${Math.round(pct)} % z cieľa ${nf(goal)} slov"><i style="width:${pct}%"></i></div>` : ""}
      <div class="btnrow" data-stop style="justify-content:flex-end;margin-top:2px">
        <button class="btn sm ghost" data-backup="${esc(p.id)}">${I.dl}Záloha</button>
        <button class="btn sm ghost danger" data-askdel="${esc(p.id)}">${I.trash}Zmazať</button>
      </div>
    </div>`;
  }).join("");
  const form = `<form class="form-card" id="newForm">
      <label class="field"><span>Názov knihy</span><input class="inp" id="nf-title" required placeholder="Napríklad Popol nad Vardenom" autocomplete="off"></label>
      <label class="field"><span>Žáner</span><input class="inp" id="nf-genre" placeholder="Epická fantasy" autocomplete="off"></label>
      <label class="field"><span>Autor / pseudonym</span><input class="inp" id="nf-author" placeholder="Meno na obálke" autocomplete="off"></label>
      <div class="row-end"><button type="button" class="btn" data-cancelnew>Zrušiť</button><button class="btn primary" type="submit">Založiť projekt</button></div>
    </form>`;
  app.innerHTML = `
  <header class="topbar"><span class="brand">${I.logo}Kronikár</span><span class="spacer"></span><select class="inp langsel" id="uiLang" aria-label="Jazyk" title="Jazyk"><option value="sk"${LANG === "sk" ? " selected" : ""}>SK</option><option value="en"${LANG === "en" ? " selected" : ""}>EN</option></select><span class="savestate" id="savestate"></span></header>
  <div class="home"><div class="home-in">
    <div class="home-head"><div><h1>Tvoje knihy</h1><p>Rukopis, svet a vzťahy medzi postavami, krajinami, náboženstvami a mágiou na jednom mieste. Hotovú knihu si stiahneš ako PDF.</p></div>
      <div class="home-actions"><span id="installSlot" style="display:contents"></span><button class="btn" id="btnImport">${I.ul}Obnoviť zo zálohy</button><button class="btn" id="btnSample">Ukážkový projekt</button><button class="btn primary" id="btnNew">${I.plus}Nový projekt</button></div></div>
    ${syncCard()}
    ${S.newForm ? form : ""}
    ${S.projects.length ? `<div class="pgrid">${cards}<button class="pcard newcard" id="btnNew2">${I.plus} Nový projekt</button></div>` :
      (S.newForm ? "" : `<div class="empty-hero"><div><h2>Zatiaľ tu nie je žiadna kniha</h2><p class="muted">Založ prvý projekt alebo si otvor ukážku a pozri sa, ako Kronikár funguje.</p>
        <ul><li>Rukopis rozdelený na časti, kapitoly a scény</li><li>Nástenka so synopsami a stavom scén</li><li>Svet: krajiny, postavy, náboženstvá, mágia, frakcie, artefakty</li><li>Mapa vzťahov ako sieť alebo strom</li><li>Export knihy do PDF s obsahom a sadzbou</li></ul>
        <div class="btnrow"><button class="btn primary" id="btnNew3">${I.plus}Založiť projekt</button><button class="btn" id="btnSample2">Otvoriť ukážku</button></div></div>
        <svg viewBox="0 0 300 200" role="img" aria-label="Ilustrácia mapy vzťahov" style="width:100%;max-width:340px;justify-self:center">
          <g stroke="var(--ink-3)" stroke-width="1.3" opacity=".6"><line x1="60" y1="60" x2="150" y2="100"/><line x1="150" y1="100" x2="245" y2="55"/><line x1="150" y1="100" x2="230" y2="160"/><line x1="150" y1="100" x2="70" y2="155"/><line x1="245" y1="55" x2="230" y2="160" stroke-dasharray="4 4"/></g>
          <circle cx="60" cy="60" r="13" fill="var(--c-krajina)"/><circle cx="150" cy="100" r="17" fill="var(--c-postava)"/><circle cx="245" cy="55" r="12" fill="var(--c-nabozenstvo)"/><circle cx="230" cy="160" r="12" fill="var(--c-magia)"/><circle cx="70" cy="155" r="10" fill="var(--c-frakcia)"/>
          <g font-family="IBM Plex Sans,sans-serif" font-size="11" fill="var(--ink-2)"><text x="60" y="88" text-anchor="middle">krajina</text><text x="150" y="132" text-anchor="middle">postava</text><text x="245" y="82" text-anchor="middle">viera</text><text x="230" y="188" text-anchor="middle">mágia</text><text x="70" y="180" text-anchor="middle">rod</text></g></svg></div>`)}
  </div></div>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>`;
  setSave(Q.err ? "err" : "ok");
  bindSyncCard();
  $("#uiLang").onchange = e => setLang(e.target.value);
  if (typeof PWA !== "undefined") PWA.slot();
  const openNew = () => { S.newForm = true; render(); setTimeout(() => $("#nf-title")?.focus(), 0); };
  ["#btnNew", "#btnNew2", "#btnNew3"].forEach(s => $(s)?.addEventListener("click", openNew));
  ["#btnSample", "#btnSample2"].forEach(s => $(s)?.addEventListener("click", createSample));
  $("#btnImport").onclick = () => $("#fileImport").click();
  $("#fileImport").onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); };
  $("[data-cancelnew]")?.addEventListener("click", () => { S.newForm = false; render(); });
  $("#newForm")?.addEventListener("submit", e => { e.preventDefault(); S.newForm = false; createProject({ title: $("#nf-title").value.trim(), genre: $("#nf-genre").value.trim(), author: $("#nf-author").value.trim() }); });
  $$(".pcard[data-open]").forEach(c => {
    c.addEventListener("click", e => { if (e.target.closest("[data-stop]")) return; openProject(c.dataset.open); });
    c.addEventListener("keydown", e => { if (e.key === "Enter" && e.target === c) openProject(c.dataset.open); });
  });
  $$("[data-askdel]").forEach(b => b.onclick = () => { S.confirm = { type: "project", id: b.dataset.askdel }; render(); });
  $$("[data-cancel]").forEach(b => b.onclick = () => { S.confirm = null; render(); });
  $$("[data-delproj]").forEach(b => b.onclick = () => deleteProject(b.dataset.delproj));
  $$("[data-backup]").forEach(b => b.onclick = () => exportBackup(b.dataset.backup));
}

const MODES = [["write", "Rukopis", I.pen], ["world", "Svet", I.globe], ["graph", "Vzťahy", I.net], ["notes", "Poznámky", I.note], ["export", "Export", I.book], ["stats", "Projekt", I.gear]];
function renderProject(app) {
  app.innerHTML = `
  <header class="topbar">
    <button class="brand" id="goHome" title="Všetky projekty">${I.logo}<span class="brand-txt">Kronikár</span></button>
    <span class="crumb">/ ${esc(S.p.title)}</span>
    <nav class="tabs" aria-label="Sekcie projektu">${MODES.map(([id, n]) => `<button class="tab${S.mode === id ? " on" : ""}" data-mode="${id}">${n}</button>`).join("")}</nav>
    <span class="spacer"></span>
    <div class="goalbox" id="goalbox"></div>
    <span class="savestate" id="savestate"></span>
  </header>
  <div id="main" style="flex:1;display:flex;min-height:0"></div>
  <nav class="mobnav">${MODES.map(([id, n, ic]) => `<button data-mode="${id}" class="${S.mode === id ? "on" : ""}">${ic}${n}</button>`).join("")}</nav>`;
  $("#goHome").onclick = goHome;
  $$("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  setSave(Q.err ? "err" : Q.pending.size ? "busy" : "ok");
  updateGoals();
  renderMode();
}
function setMode(m) {
  if (S.mode === m && m !== "write") return;
  if (S.mode === "write" && m === "write") { S.mobBinder = !S.mobBinder; renderMode(); return; }
  S.mode = m; S.confirm = null;
  $$("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  renderMode();
}
function renderMode() {
  const main = $("#main");
  stopSim();
  if (typeof SelPop !== "undefined") SelPop.hide();
  if (S.mode === "write") renderWrite(main);
  else if (S.mode === "world") renderWorld(main);
  else if (S.mode === "graph") renderGraph(main);
  else if (S.mode === "notes") renderNotes(main);
  else if (S.mode === "export") renderExport(main);
  else renderStats(main);
}
function updateGoals() {
  const box = $("#goalbox"); if (!box || !S.p) return;
  const tw = totalWords(), g = S.p.goals || {}, d = S.p.dayStart ? Math.max(0, tw - S.p.dayStart.words) : 0;
  const bar = (v, max) => `<span class="bar"><i style="width:${max ? Math.min(100, v / max * 100) : 0}%"></i></span>`;
  box.innerHTML = (g.daily ? `<div class="goal daily-only"><span>Dnes <b class="mono">${nf(d)}</b> / ${nf(g.daily)}</span>${bar(d, g.daily)}</div>` : "") +
    `<div class="goal" title="${fmtNS(totalChars())} normostrán"><span>Spolu <b class="mono">${nf(tw)}</b>${g.total ? " / " + nf(g.total) : " slov"}</span>${g.total ? bar(tw, g.total) : ""}</div>`;
}
</script>
