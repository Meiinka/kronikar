}

    $$("[data-dl]", main).forEach(x => x.disabled = true); st.textContent = "Pripravujem súbor…";
    try {
      const [mode, fmt] = what.split("-"), suffix = { full: "", text: "-text", toc: "-obsah", desc: "-popis" }[mode];
      if (mode === "desc" && !descSections(t.lang || "sk").length) throw new Error("Popis je prázdny – vyplň logline, anotáciu alebo synopsu.");
      const blob = fmt === "pdf" ? (mode === "desc" ? await buildDescPdf() : await buildPdf(mode)) : await buildDocx(mode);
      st.textContent = "Hotovo – " + Math.max(1, Math.round(blob.size / 1024)) + " kB.";
      await saveFile(base + suffix + (fmt === "pdf" ? ".pdf" : ".docx"), blob, fmt === "pdf" ? "application/pdf" : "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
    } catch (err) { console.error(err); st.textContent = "Nepodarilo sa: " + (err.message || err); }
    finally { $$("[data-dl]", main).forEach(x => x.disabled = false); }
  });
}
</script>
