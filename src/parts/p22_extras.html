<script>
/* ================= world & story extras: ages in scenes, family tree, journeys on maps,
   appendices for export, plot threads, who knows what ================= */

/* reading order of every node of the manuscript (a folder comes before its content) */
function readOrder() { const m = new Map(); let i = 0; walk(S.p.binder, n => { m.set(n.id, i++); }); return m; }
function scenePresent(n) {
  const html = S.items[n.id]?.html;
  const cp = nodePovs(n);
  return entsBy("postava").filter(c => n.pov === c.id || cp.includes(c.id) || (n.ents || []).includes(c.id) || mentions(c, html));
}
const yearDays = () => { const c = cal(); return c.months.length * c.mdays; };

/* ---------- 1. ages of characters in a scene ---------- */
function charAt(c, sp) {
  if (!c.time || !tvOk(c.time.from)) return null;
  const born = tnum(c.time.from);
  if (sp[1] < born) return { state: "unborn" };
  if (tvOk(c.time.to) && sp[0] > tnum(c.time.to, true)) return { state: "dead" };
  return { state: "alive", age: Math.max(0, Math.floor(sp[0] - born + 1e-9)) };
}
const ageTxt = n => LANG === "en" ? n + (n === 1 ? " year" : " years") : n + " " + plural(n, "rok", "roky", "rokov");
function sceneAgesHtml(n) {
  const sp = tspan(n.time); if (!sp) return "";
  const rows = scenePresent(n).map(c => [c, charAt(c, sp)]).filter(([, a]) => a);
  if (!rows.length) return "";
  return `<div class="ages"><span class="lbl">${esc(tl("Vek postáv v scéne"))}</span><div class="chips">${rows.map(([c, a]) => a.state === "alive" ? `<span class="chip"><span class="no-tr">${esc(c.name)}</span>&nbsp;<b>${esc(ageTxt(a.age))}</b></span>` : `<span class="chip warnchip" title="${esc(tl("Skontroluj čas scény alebo narodenie postavy."))}">! <span class="no-tr">${esc(c.name)}</span>&nbsp;· ${esc(a.state === "unborn" ? tl("ešte sa nenarodil(a)") : tl("už nežije"))}</span>`).join("")}</div></div>`;
}
/* age span of a character across the scenes with a time */
function charStoryAge(c) {
  if (!c.time || !tvOk(c.time.from)) return "";
  const ages = allTexts().filter(n => tspan(n.time) && (n.pov === c.id || (n.ents || []).includes(c.id) || nodePovs(n).includes(c.id) || mentions(c, S.items[n.id]?.html))).map(n => charAt(c, tspan(n.time))).filter(a => a && a.state === "alive").map(a => a.age);
  if (!ages.length) return "";
  const a = Math.min(...ages), b = Math.max(...ages);
  return a === b ? tl("V deji knihy má {x}.", ageTxt(a)) : tl("V deji knihy má {x} – {x}.", String(a), ageTxt(b));
}

/* ---------- 2. family tree ---------- */
const FAM_KINDS = [["parent", "je rodičom"], ["child", "je dieťaťom"], ["spouse", "je partnerom / partnerkou"], ["sibling", "je súrodencom"], ["none", "nepatrí do rodokmeňa"]];
function famGuess(label) {
  const l = relNorm(label);
  if (/(bratran|sesternic|synov|neter|stryk|strycn|ujo|teta|svokr|svagr|zatom|zat$|nevest|bratov|sestrin)/.test(l)) return null;
  if (/\b(otc|otec|matk|matka|rodic|father|mother|parent)/.test(l)) return "parent";
  if (/\b(syn|dcer|dcera|dietat|dieta|son|daughter|child)/.test(l)) return "child";
  if (/\b(manzel|partner|snubenec|snubenic|husband|wife|spouse|married)/.test(l)) return "spouse";
  if (/\b(surodenc|brat|sestr|dvojic|sibling|brother|sister|twin)/.test(l)) return "sibling";
  return null;
}
const FAM_CATS = ["postava", "bozstvo"];
function famKind(label) { const m = S.p.famMap || {}; return m[label] || famGuess(label); }
function famLinks() { return (S.p.links || []).filter(l => { const A = S.ents[l.a], B = S.ents[l.b]; return A && B && A.cat === B.cat && FAM_CATS.includes(A.cat); }); }
function famData() {
  const par = new Map(), spouse = new Set(), sib = [], nodes = new Set();
  const addPar = (child, p) => { if (!par.has(child)) par.set(child, new Set()); par.get(child).add(p); };
  famLinks().forEach(l => {
    const k = famKind(l.label); if (!k || k === "none") return;
    nodes.add(l.a); nodes.add(l.b);
    if (k === "parent") addPar(l.b, l.a); else if (k === "child") addPar(l.a, l.b);
    else if (k === "spouse") spouse.add([l.a, l.b].sort().join("|")); else sib.push([l.a, l.b]);
  });
  /* siblings share known parents */
  const groups = new Map(); const root = x => { while (groups.has(x) && groups.get(x) !== x) x = groups.get(x); return x; };
  sib.forEach(([a, b]) => { groups.set(a, root(a)); groups.set(b, root(b)); groups.set(root(a), root(b)); });
  const sg = new Map(); [...nodes].forEach(n => { if (!groups.has(n)) return; const r = root(n); if (!sg.has(r)) sg.set(r, []); sg.get(r).push(n); });
  sg.forEach(list => { const ps = new Set(); list.forEach(n => (par.get(n) || []).forEach(p => ps.add(p))); if (ps.size) list.forEach(n => ps.forEach(p => addPar(n, p))); });
  return { nodes: [...nodes], par, spouse: [...spouse].map(s => s.split("|")), sibGroups: [...sg.values()].filter(l => l.length > 1) };
}
function famLayout(F) {
  const gen = new Map(), adj = new Map(), push = (a, b, d) => { if (!adj.has(a)) adj.set(a, []); adj.get(a).push([b, d]); };
  F.par.forEach((ps, c) => ps.forEach(p => { push(p, c, 1); push(c, p, -1); }));
  F.spouse.forEach(([a, b]) => { push(a, b, 0); push(b, a, 0); });
  F.sibGroups.forEach(g => g.forEach(a => g.forEach(b => a !== b && push(a, b, 0))));
  const comps = [], name = id => S.ents[id]?.name || "";
  const order = F.nodes.slice().sort((a, b) => (F.par.has(a) ? 1 : 0) - (F.par.has(b) ? 1 : 0) || name(a).localeCompare(name(b), "sk"));
  order.forEach(s => {
    if (gen.has(s)) return; const comp = [s]; gen.set(s, 0); const q = [s];
    while (q.length) { const x = q.shift(); (adj.get(x) || []).forEach(([y, d]) => { if (!gen.has(y)) { gen.set(y, gen.get(x) + d); comp.push(y); q.push(y); } }); }
    const mn = Math.min(...comp.map(x => gen.get(x))); comp.forEach(x => gen.set(x, gen.get(x) - mn)); comps.push(comp);
  });
  const BW = 156, BH = 50, GX = 26, GY = 74, pos = new Map(); let ox = 0;
  comps.sort((a, b) => b.length - a.length).forEach(comp => {
    const rows = []; comp.forEach(x => { const g = gen.get(x); (rows[g] = rows[g] || []).push(x); });
    const xOf = new Map();
    const place = (row) => { let x = 0; row.forEach(id => { xOf.set(id, x); x += BW + GX; }); };
    for (let pass = 0; pass < 3; pass++) rows.forEach((row, g) => {
      if (!row) return;
      if (g > 0 || pass > 0) {
        const bc = id => { const ps = [...(F.par.get(id) || [])].filter(p => xOf.has(p)); if (ps.length) return ps.reduce((s, p) => s + xOf.get(p), 0) / ps.length; const kids = [...F.par.entries()].filter(([, s]) => s.has(id)).map(([c]) => c).filter(c => xOf.has(c)); if (kids.length) return kids.reduce((s, c) => s + xOf.get(c), 0) / kids.length; return xOf.has(id) ? xOf.get(id) : 1e9; };
        row.sort((a, b) => bc(a) - bc(b));
      }
      /* partners side by side */
      for (let i = 0; i < row.length; i++) { const sp = F.spouse.find(([a, b]) => a === row[i] || b === row[i]); if (!sp) continue; const o = sp[0] === row[i] ? sp[1] : sp[0], j = row.indexOf(o); if (j > i + 1) { row.splice(j, 1); row.splice(i + 1, 0, o); } }
      place(row);
    });
    /* centre each generation under the widest one, then pull children under their parents */
    const width = Math.max(...rows.filter(Boolean).map(r => r.length)) * (BW + GX) - GX;
    rows.forEach(row => { if (!row) return; const w = row.length * (BW + GX) - GX, sh = (width - w) / 2; row.forEach(id => xOf.set(id, xOf.get(id) + sh)); });
    rows.forEach((row, g) => { if (!row || !g) return; let minX = -1e9; row.forEach(id => { const ps = [...(F.par.get(id) || [])].filter(p => xOf.has(p)); let want = xOf.get(id); if (ps.length) { const sibs = row.filter(s => { const q = F.par.get(s); return q && [...q].sort().join() === [...F.par.get(id)].sort().join(); }); const k = sibs.indexOf(id), mid = ps.reduce((s, p) => s + xOf.get(p), 0) / ps.length; want = mid - (sibs.length - 1) * (BW + GX) / 2 + k * (BW + GX); } const x = Math.max(want, minX); xOf.set(id, x); minX = x + BW + GX; }); });
    const mnx = Math.min(...comp.map(id => xOf.get(id)));
    comp.forEach(id => pos.set(id, { x: ox + xOf.get(id) - mnx, y: gen.get(id) * (BH + GY) }));
    ox = Math.max(...comp.map(id => pos.get(id).x)) + BW + GX * 4;
  });
  const W = Math.max(BW, ox - GX * 4), H = Math.max(BH, ...[...pos.values()].map(p => p.y + BH));
  return { pos, BW, BH, GY, W, H };
}
/* the tree as SVG; pal = colours (the app's theme, or light for print) */
function famSvg(F, L, pal, sel) {
  const { pos, BW, BH, GY } = L, P = 20, out = [];
  const cx = id => pos.get(id).x + BW / 2 + P, top = id => pos.get(id).y + P;
  F.spouse.forEach(([a, b]) => { if (!pos.has(a) || !pos.has(b)) return; const [l, r] = pos.get(a).x < pos.get(b).x ? [a, b] : [b, a], y = top(l) + BH / 2; if (pos.get(l).y === pos.get(r).y) out.push(`<path d="M${pos.get(l).x + BW + P} ${y - 2}H${pos.get(r).x + P}M${pos.get(l).x + BW + P} ${y + 2}H${pos.get(r).x + P}" stroke="${pal.line}" stroke-width="1.4" fill="none"/>`); });
  const fams = new Map(); F.par.forEach((ps, c) => { if (!pos.has(c)) return; const k = [...ps].filter(p => pos.has(p)).sort().join("|"); if (!k) return; if (!fams.has(k)) fams.set(k, []); fams.get(k).push(c); });
  fams.forEach((kids, k) => {
    const ps = k.split("|"), px = ps.reduce((s, p) => s + cx(p), 0) / ps.length, py = Math.max(...ps.map(p => top(p))) + (ps.length > 1 && pos.get(ps[0]).y === pos.get(ps[1]).y ? BH / 2 : BH);
    const bus = Math.min(...kids.map(c => top(c))) - GY / 2, xs = kids.map(cx);
    out.push(`<path d="M${px} ${py}V${bus}M${Math.min(px, ...xs)} ${bus}H${Math.max(px, ...xs)}${xs.map(x => `M${x} ${bus}V${bus + GY / 2}`).join("")}" stroke="${pal.line}" stroke-width="1.4" fill="none"/>`);
  });
  F.sibGroups.forEach(g => { if (g.some(id => F.par.has(id))) return; const ps = g.filter(id => pos.has(id)); if (ps.length < 2) return; const y = Math.min(...ps.map(top)) - 14, xs = ps.map(cx); out.push(`<path d="M${Math.min(...xs)} ${y}H${Math.max(...xs)}${xs.map(x => `M${x} ${y}V${y + 14}`).join("")}" stroke="${pal.line}" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>`); });
  pos.forEach((p, id) => {
    const e = S.ents[id], col = pal.cat(e.cat), yrs = e.time && tvOk(e.time.from) ? (e.time.from.y + (tvOk(e.time.to) ? " – " + e.time.to.y : " –")) : (keyFieldOf(e)?.v || "");
    const nm = (e.name || tl("Bez mena")), fit = s => s.length > 22 ? s.slice(0, 21) + "…" : s;
    out.push(`<g class="fnode${sel === id ? " sel" : ""}" data-fid="${id}" style="cursor:pointer"><rect x="${p.x + P}" y="${p.y + P}" width="${BW}" height="${BH}" rx="8" fill="${pal.paper}" stroke="${sel === id ? pal.accent : pal.line}" stroke-width="${sel === id ? 2.2 : 1.2}"/><rect x="${p.x + P}" y="${p.y + P}" width="5" height="${BH}" rx="2" fill="${col}"/><text x="${p.x + P + BW / 2 + 2}" y="${p.y + P + (yrs ? 21 : 30)}" text-anchor="middle" font-family="Georgia, serif" font-size="13.5" font-weight="700" fill="${pal.ink}">${esc(fit(nm))}<title>${esc(nm)}</title></text>${yrs ? `<text x="${p.x + P + BW / 2 + 2}" y="${p.y + P + 38}" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="${pal.muted}">${esc(fit(String(yrs)))}</text>` : ""}</g>`);
  });
  const W = L.W + P * 2, H = L.H + P * 2;
  return { svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${pal.bg ? `<rect width="${W}" height="${H}" fill="${pal.bg}"/>` : ""}${out.join("")}</svg>`, W, H };
}
const PAL_PRINT = { ink: "#1E1E1E", muted: "#6E6E6E", line: "#9A9A9A", paper: "#FFFFFF", accent: "#B5523A", bg: "#FFFFFF", cat: id => ({ postava: "#35589C", bozstvo: "#4F55C9" })[id] || "#646A75" };
function palApp() { const v = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim(); return { ink: v("--ink"), muted: v("--ink-3"), line: v("--ink-3"), paper: v("--paper"), accent: v("--accent"), bg: "", cat: id => cssCol(catColor(id)) }; }
async function svgToPng(svg, W, H, scale = 2) {
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const c = document.createElement("canvas"); c.width = Math.round(W * scale); c.height = Math.round(H * scale);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); return c;
  } finally { URL.revokeObjectURL(url); }
}
const FAM = { sel: null, k: 1 };
function renderFamily(main) {
  const g = S.graph, F = famData();
  const labels = [...new Set(famLinks().map(l => l.label))].sort((a, b) => a.localeCompare(b, "sk"));
  main.innerHTML = `<div class="graph-wrap fam-wrap" style="flex:1">
    <div class="graph-main">
      <div class="gtools">
        <div class="seg" role="group" aria-label="Zobrazenie"><button data-gm="net">Sieť</button><button data-gm="tree">Strom</button><button data-gm="fam" class="on">${esc(tl("Rodokmeň"))}</button></div>
        <span class="spacer"></span>
        <button class="btn icon" data-fz="0.8" aria-label="Oddialiť">−</button><button class="btn icon" data-fz="1.25" aria-label="Priblížiť">${I.plus}</button>
        <button class="btn sm" id="famPng">${I.dl}${esc(tl("Uložiť ako obrázok"))}</button>
      </div>
      <div class="famview" id="famView">${F.nodes.length ? "" : `<div class="bigempty"><h3>${esc(tl("Rodokmeň"))}</h3><p style="max-width:54ch">${esc(tl("Rodokmeň sa poskladá sám zo vzťahov medzi postavami (a medzi božstvami): je otcom, je matkou, je synom, je dcérou, je súrodencom, je manželom / manželkou. Vlastné vzťahy mu môžeš priradiť vpravo."))}</p></div>`}</div>
    </div>
    <aside class="gside fam-side"><h3>${esc(tl("Vzťahy v rodokmeni"))}</h3><p class="hint">${esc(tl("Ku každému vzťahu medzi postavami vyber, čo znamená v rodine. Smer: prvá postava → vzťah → druhá postava."))}</p>
      ${labels.length ? labels.map(l => { const k = famKind(l) || "none", auto = !(S.p.famMap || {})[l]; return `<label class="field famrow"><span class="no-tr">${esc(l)}</span><select class="inp" data-fam="${esc(l)}">${FAM_KINDS.map(([v, n]) => `<option value="${v}"${k === v ? " selected" : ""}>${esc(tl(n))}${auto && k === v && v !== "none" ? " · " + esc(tl("rozpoznané")) : ""}</option>`).join("")}</select></label>`; }).join("") : `<p class="hint">${esc(tl("Zatiaľ žiadne vzťahy medzi postavami."))}</p>`}
    </aside></div>`;
  $$("[data-gm]", main).forEach(b => b.onclick = () => { g.mode = b.dataset.gm; g.fitted = false; renderGraph(main); });
  $$("[data-fam]", main).forEach(s => s.onchange = () => { S.p.famMap = Object.assign({}, S.p.famMap, { [s.dataset.fam]: s.value }); saveProject(); renderFamily(main); });
  const view = $("#famView", main);
  if (!F.nodes.length) { $("#famPng", main).disabled = true; return; }
  const L = famLayout(F), draw = () => { const r = famSvg(F, L, palApp(), FAM.sel); view.innerHTML = r.svg; const s = $("svg", view); s.setAttribute("width", Math.round(r.W * FAM.k)); s.setAttribute("height", Math.round(r.H * FAM.k)); $$("[data-fid]", view).forEach(n => { n.onclick = () => { FAM.sel = n.dataset.fid; draw(); }; n.ondblclick = () => openEnt(n.dataset.fid); }); };
  draw();
  $$("[data-fz]", main).forEach(b => b.onclick = () => { FAM.k = Math.max(.3, Math.min(3, FAM.k * +b.dataset.fz)); draw(); });
  $("#famPng", main).onclick = async () => { const r = famSvg(F, L, PAL_PRINT); const c = await svgToPng(r.svg, r.W, r.H); const blob = await new Promise(res => c.toBlob(res, "image/png")); await saveFile(slug((S.p.title || "kniha") + "-rodokmen") + ".png", blob, "image/png"); };
  if (FAM.sel && S.ents[FAM.sel]) { const side = $(".fam-side", main); side.insertAdjacentHTML("afterbegin", `<div class="famsel"><b class="no-tr">${esc(S.ents[FAM.sel].name)}</b><button class="btn sm" id="famOpen">${esc(tl("Otvoriť záznam"))}</button></div>`); $("#famOpen", side).onclick = () => openEnt(FAM.sel); }
}

/* ---------- 3. journeys of characters on a map ---------- */
function tripPlaces(m) {
  const P = {};
  (m.pins || []).forEach(p => { if (p.ent && !P[p.ent]) P[p.ent] = { x: p.x, y: p.y }; });
  (m.areas || []).forEach(a => { if (a.ent && !P[a.ent]) { const g = polyGeo(a.pts, m.w, m.h); P[a.ent] = { x: g.x, y: g.y }; } });
  (m.marks || []).forEach(k => { if (k.ent && !P[k.ent]) P[k.ent] = { x: k.x, y: k.y }; });
  return P;
}
/* the stops of one character: scenes they are in, at a place that is on this map */
function tripOf(c, m, chrono) {
  const P = tripPlaces(m), ord = readOrder();
  let sc = allTexts().filter(n => scenePresent(n).includes(c)).map(n => {
    const pid = n.place && P[n.place] ? n.place : (n.ents || []).find(id => P[id] && S.ents[id]?.cat !== "postava");
    return pid ? { n, ent: pid, pt: P[pid], sp: tspan(n.time), o: ord.get(n.id) } : null;
  }).filter(Boolean);
  if (chrono) sc = sc.filter(s => s.sp).sort((a, b) => a.sp[0] - b.sp[0] || a.o - b.o);
  const stops = []; sc.forEach(s => { const last = stops[stops.length - 1]; if (last && last.ent === s.ent) { last.scenes.push(s.n); if (s.sp) last.sp = last.sp ? [Math.min(last.sp[0], s.sp[0]), Math.max(last.sp[1], s.sp[1])] : s.sp; } else stops.push({ ent: s.ent, pt: s.pt, scenes: [s.n], sp: s.sp }); });
  /* distances and speed */
  const km = +m.km || 0, perDay = +m.kmday || 40, warns = [];
  for (let i = 1; i < stops.length; i++) {
    const a = stops[i - 1], b = stops[i];
    const d = km ? Math.hypot((b.pt.x - a.pt.x) * m.w, (b.pt.y - a.pt.y) * m.h) / m.w * km : 0; b.km = d;
    if (km && a.sp && b.sp) {
      const days = (b.sp[0] - a.sp[1]) * yearDays(); b.days = days;
      if (d > 1 && days < d / perDay - .01) warns.push({ i, txt: days <= 0 ? tl("{x} → {x}: na cestu ({x} km) nezostal žiadny čas.", S.ents[a.ent].name, S.ents[b.ent].name, Math.round(d)) : tl("{x} → {x}: {x} km za {x} dní – to je {x} km za deň.", S.ents[a.ent].name, S.ents[b.ent].name, Math.round(d), Math.max(1, Math.round(days)), Math.round(d / Math.max(days, .1))) });
    }
  }
  return { stops, warns };
}
function tripColor(id) { const i = entsBy("postava").findIndex(c => c.id === id); return TL_COLORS[(i < 0 ? 0 : i) % TL_COLORS.length]; }
function tripSvg(m, u) {
  if (!u.tripsOpen || !u.trips || !u.trips.size) return "";
  const M = mapUnit(m), out = [], ids = [...u.trips].filter(id => S.ents[id]);
  ids.forEach((id, k) => {
    const { stops } = tripOf(S.ents[id], m, u.tripChrono), col = tripColor(id), off = (k - (ids.length - 1) / 2) * M / 260;
    if (!stops.length) return;
    const pts = stops.map(s => [s.pt.x * m.w + off, s.pt.y * m.h + off]);
    if (pts.length > 1) out.push(`<path d="M${pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L")}" fill="none" stroke="${col}" stroke-width="${(M / 260).toFixed(1)}" stroke-dasharray="${(M / 90).toFixed(1)} ${(M / 160).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`);

      <div class="th-row"><span class="lbl">${esc(tl("Čitateľ sa dozvie v"))}</span><select class="inp sm" data-ser><option value="">${esc(tl("— zatiaľ nie —"))}</option>${opts.replace(`value="${se.reader}"`, `value="${se.reader}" selected`)}</select></div>
      <div class="th-row"><span class="lbl">${esc(tl("Postavy, ktoré to vedia"))}</span><div class="se-know">${know.map(([cid, k]) => `<div class="se-k"><span class="no-tr">${esc(S.ents[cid].name)}</span><span class="hint">${esc(tl("vie od"))}</span><select class="inp sm" data-sek="${cid}"><option value="start"${k === "start" ? " selected" : ""}>${esc(tl("začiatku knihy"))}</option>${opts.replace(`value="${k}"`, `value="${k}" selected`)}</select><button class="btn icon ghost sm" data-serm="${cid}" aria-label="${esc(tl("Odobrať"))}">×</button></div>`).join("")}
        <div class="se-k add"><select class="inp sm" data-seadd><option value="">${esc(tl("+ postava, ktorá to vie…"))}</option>${people.filter(c => !(se.know || {})[c.id]).map(c => `<option value="${c.id}">${esc(c.name || tl("Bez mena"))}</option>`).join("")}</select></div></div></div>
      <details class="th-more"${se.note ? " open" : ""}><summary>${esc(tl("Poznámka"))}</summary><textarea class="inp no-tr" data-sen rows="2">${esc(se.note || "")}</textarea></details>
    </div>`; }).join("") || `<p class="hint">${esc(tl("Zatiaľ žiadne tajomstvá."))}</p>`}</div>`;
  const again = () => renderSecretsTool(pg), sv = () => { saveProject(); again(); };
  const add = () => { const v = $("#seNew", pg).value.trim(); if (!v) return; secrets().push({ id: uid("se"), t: v, know: {} }); sv(); };
  $("#seAdd", pg).onclick = add; $("#seNew", pg).onkeydown = ev => { if (ev.key === "Enter") add(); };
  $$("[data-se]", pg).forEach(card => {
    const se = secrets().find(x => x.id === card.dataset.se); se.know = se.know || {};
    $("[data-set]", card).onchange = ev => { se.t = ev.target.value.trim() || se.t; saveProject(); };
    $("[data-sen]", card).oninput = debounce(ev => { se.note = ev.target.value; saveProject(); }, 400);
    $("[data-sedel]", card).onclick = () => { S.p.secrets = secrets().filter(x => x !== se); sv(); };
    $("[data-ser]", card).onchange = ev => { if (ev.target.value) se.reader = ev.target.value; else delete se.reader; saveProject(); };
    $$("[data-sek]", card).forEach(s => s.onchange = () => { se.know[s.dataset.sek] = s.value; saveProject(); });
    $$("[data-serm]", card).forEach(b => b.onclick = () => { delete se.know[b.dataset.serm]; sv(); });
    $("[data-seadd]", card).onchange = ev => { if (!ev.target.value) return; se.know[ev.target.value] = "start"; sv(); };
  });
}

/* ---------- inspector of a scene / chapter: threads and secrets here ---------- */
function mountNodeStory(el, n) {
  const tb = $("#iThreads", el), sb = $("#iSecrets", el);
  if (tb) {
    const here = new Set([n.id]); const f = findNode(n.id); if (f && f.parent && n.type === "text") here.add(f.parent.id);
    const rows = threads().map(th => ({ th, s: (th.set || []).some(id => here.has(id)), p: (th.pay || []).some(id => here.has(id)) })).filter(x => x.s || x.p);
    const open = threads().filter(th => threadState(th).st === "open" && !rows.some(r => r.th === th));
    tb.innerHTML = `<span class="lbl">${esc(tl("Nitky deja"))}</span>${rows.map(r => `<div class="nev" data-thgo role="button"><b class="no-tr">${esc(r.th.t)}</b> <span class="hint">${esc([r.s ? tl("nastolené tu") : "", r.p ? tl("vyriešené tu") : ""].filter(Boolean).join(" · "))}</span></div>`).join("")}
      <div class="th-quick"><select class="inp sm" id="iThSel"><option value="">${esc(tl("Nitka…"))}</option>${threads().map(th => `<option value="${th.id}">${esc(th.t)}${threadState(th).st === "open" ? " •" : ""}</option>`).join("")}<option value="new">${esc(tl("+ nová nitka…"))}</option></select><input class="inp sm" id="iThNew" placeholder="${esc(tl("Názov novej nitky"))}" hidden autocomplete="off"><button class="btn sm" data-thq="set">${esc(tl("Nastolené tu"))}</button><button class="btn sm" data-thq="pay">${esc(tl("Vyriešené tu"))}</button></div>
      <button class="lnk hint" id="iThAll">${esc(threads().length ? tl("Všetky nitky deja ({x}, otvorené: {x})", threads().length, threads().filter(th => threadState(th).st === "open").length) : tl("Prehľad nitiek deja"))} →</button>`;
    $$("[data-thq]", tb).forEach(b => b.onclick = () => {
      let id = $("#iThSel", tb).value; if (!id) { toast(tl("Vyber nitku.")); return; }
      if (id === "new") { const t = $("#iThNew", tb).value.trim(); if (!t) { toast(tl("Napíš názov nitky.")); $("#iThNew", tb).focus(); return; } const th = { id: uid("th"), t, set: [], pay: [] }; threads().push(th); id = th.id; }
      const th = threads().find(x => x.id === id), k = b.dataset.thq; th[k] = [...new Set([...(th[k] || []), n.id])]; if (k === "pay") delete th.open; saveProject(); mountNodeStory(el, n); toast(tl("Uložené."));
    });
    $("#iThSel", tb).onchange = ev => { const ni = $("#iThNew", tb); ni.hidden = ev.target.value !== "new"; if (!ni.hidden) ni.focus(); };
    $("#iThAll", tb)?.addEventListener("click", () => openTools("threads"));
    $$("[data-thgo]", tb).forEach(d => d.onclick = () => { TT.filter = "all"; openTools("threads"); });
  }
  if (sb) {
    const list = secrets(); if (!list.length || n.type !== "text") { sb.innerHTML = list.length ? "" : `<span class="lbl">${esc(tl("Kto čo vie"))}</span><button class="lnk hint" id="iSeOpen">${esc(tl("Zapísať tajomstvá a kto ich pozná…"))}</button>`; $("#iSeOpen", sb)?.addEventListener("click", () => openTools("secrets")); if (!list.length && n.type !== "text") sb.innerHTML = ""; return; }
    const ord = readOrder(), ppl = scenePresent(n);
    const rows = list.map(se => { const k = ppl.filter(c => knowsAt(se, c.id, n.id, ord)), nk = ppl.filter(c => !knowsAt(se, c.id, n.id, ord)), rd = se.reader && nodeOk(se.reader) && ord.get(se.reader) <= ord.get(n.id); return { se, k, nk, rd }; }).filter(r => r.k.length || Object.keys(r.se.know || {}).some(cid => ppl.some(c => c.id === cid)));
    sb.innerHTML = `<span class="lbl">${esc(tl("Kto čo vie"))}</span>${rows.length ? rows.map(r => `<div class="nev"><b class="no-tr">${esc(r.se.t)}</b>${r.rd ? ` <span class="badge soft">${esc(tl("čitateľ vie"))}</span>` : ""}<div class="hint">${r.k.length ? esc(tl("vie: {x}", r.k.map(c => c.name).join(", "))) : ""}${r.k.length && r.nk.length ? " · " : ""}${r.nk.length ? `<span class="nk">${esc(tl("ešte nevie: {x}", r.nk.map(c => c.name).join(", ")))}</span>` : ""}</div></div>`).join("") : `<span class="hint">${esc(tl("Nikto z prítomných nepozná žiadne zo zapísaných tajomstiev."))}</span>`}<button class="lnk hint" id="iSeOpen">${esc(tl("Upraviť tajomstvá…"))}</button>`;
    $("#iSeOpen", sb).onclick = () => openTools("secrets");
  }
}
</script>
