<script>
/* ================= world (codex) ================= */
function openEnt(id) {
  flushEditor();
  S.ent = id; S.cat = "all"; S.worldPane = "detail"; S.confirm = null;
  if (S.mode !== "world") { S.mode = "world"; $$("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === "world")); }
  renderMode();
}
function newEnt(cat) {
  const id = uid("e"); S.catEdit = null;
  S.ents[id] = { id, cat: cat && cat !== "all" ? cat : "postava", name: "", summary: "", fields: {}, custom: [], notes: "", tags: [], created: Date.now() };
  S.ent = id; S.worldPane = "detail"; saveEnt(id);
  return id;
}
function renderWorld(main) {
  const counts = {}; Object.values(S.ents).forEach(e => counts[e.cat] = (counts[e.cat] || 0) + 1);
  main.innerHTML = `<div class="world m-${S.worldPane === "cats" ? "cats" : S.worldPane === "detail" ? "detail" : "list"}" id="world" style="flex:1">
    <aside class="pane left p-cats" aria-label="Kategórie">
      <div class="pane-head"><span class="lbl">Svet</span></div>
      <div class="catlist" id="catlist"></div>
    </aside>
    <section class="pane left p-list" aria-label="Záznamy" style="border-right:1px solid var(--line)">
      <div class="pane-head"><button class="btn icon ghost backbtn" id="toCats" title="Kategórie">${I.back}</button><span class="lbl">${S.cat === "all" ? "Všetky záznamy" : esc((CAT[S.cat] || { name: "Záznamy" }).name)}</span>
        <button class="btn sm primary" id="addEnt">${I.plus}Nový</button></div>
      <div class="searchbox">${I.search}<input class="inp" id="eq" placeholder="Hľadať vo svete" value="${esc(S.eq)}" autocomplete="off"></div>
      <div class="elist" id="elist"></div>
    </section>
    <section class="edetail" id="edetail" aria-label="Detail záznamu"></section>
  </div>`;
  renderCatList();
  $("#toCats").onclick = () => { S.worldPane = "cats"; $("#world").className = "world m-cats"; };
  $("#addEnt").onclick = () => { newEnt(S.cat); renderWorld(main); setTimeout(() => $("#eName")?.focus(), 30); };
  $("#eq").oninput = debounce(e => { S.eq = $("#eq").value; renderEList(); }, 120);
  renderEList(); renderEDetail();
}
function renderCatList() {
  const el = $("#catlist"); if (!el) return;
  const counts = {}; Object.values(S.ents).forEach(e => counts[e.cat] = (counts[e.cat] || 0) + 1);
  el.innerHTML = `<button class="catbtn${S.cat === "all" ? " on" : ""}" data-cat="all"><span class="cd" style="background:var(--ink-3)"></span>Všetko<span class="n">${Object.keys(S.ents).length}</span></button>
    ${CATS.map(c => `<div class="catbtn${S.cat === c.id ? " on" : ""}" data-cat="${c.id}" role="button" tabindex="0"><span class="cd" style="background:${catColor(c.id)}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</span>${c.custom ? `<button class="ed" data-editcat="${c.id}" title="Upraviť kategóriu" aria-label="Upraviť kategóriu">${I.pen}</button>` : ""}<span class="n">${counts[c.id] || 0}</span></div>`).join("")}
    <button class="catbtn add" id="addCat">${I.plus}Nová kategória</button>`;
  $$("[data-cat]", el).forEach(b => { b.onclick = ev => { if (ev.target.closest("[data-editcat]")) return; S.cat = b.dataset.cat; S.catEdit = null; S.worldPane = "list"; renderWorld($("#main")); }; b.onkeydown = ev => { if (ev.key === "Enter") b.click(); }; });
  $$("[data-editcat]", el).forEach(b => b.onclick = () => { S.cat = b.dataset.editcat; S.catEdit = b.dataset.editcat; S.confirm = null; S.worldPane = "detail"; renderWorld($("#main")); });
  $("#addCat").onclick = () => {
    const p = S.p; p.customCats = p.customCats || [];
    const id = "k" + uid();
    p.customCats.push({ id, name: tl("Nová kategória"), one: tl("Záznam"), color: CUSTOM_COLORS[p.customCats.length % CUSTOM_COLORS.length], fields: [] });
    setCats(p.customCats); saveProject();
    S.cat = id; S.catEdit = id; S.worldPane = "detail"; renderWorld($("#main"));
    setTimeout(() => { const n = $("#cName"); if (n) { n.focus(); n.select(); } }, 30);
  };
}
function renderCatEditor(el) {
  const p = S.p, c = (p.customCats || []).find(x => x.id === S.catEdit);
  if (!c) { S.catEdit = null; return renderEDetail(); }
  const n = Object.values(S.ents).filter(e => e.cat === c.id).length;
  const conf = S.confirm && S.confirm.type === "cat" && S.confirm.id === c.id;
  el.innerHTML = `<div class="edetail-in">
    <div class="ehead" style="--cc:${c.color}"><div class="kind"><button class="btn icon ghost backbtn" id="toList" title="Späť">${I.back}</button><span class="badge">Vlastná kategória</span></div>
      <input class="ename" id="cName" value="${esc(c.name)}" placeholder="Názov kategórie, napr. Bytosti" aria-label="Názov kategórie"></div>
    <div class="card"><h3>Nastavenia kategórie</h3>
      <div class="fgrid">
        <label class="field"><span>Jeden záznam sa volá</span><input class="inp" id="cOne" value="${esc(c.one || "")}" placeholder="napr. Bytosť"></label>
        <div class="field"><span>Farba</span><div class="swatches">${CUSTOM_COLORS.map(col => `<button class="sw${col === c.color ? " on" : ""}" data-col="${col}" style="background:${col}" aria-label="Farba ${col}"></button>`).join("")}</div></div>
      </div>
      <label class="field"><span>Predvolené polia – jedno na riadok</span><textarea class="inp" id="cFields" rows="6" placeholder="Napríklad:
Výskyt
Vzhľad
Schopnosti
Slabiny">${esc((c.fields || []).join("\n"))}</textarea></label>
      <span class="hint">Polia sa zobrazia pri každom zázname v tejto kategórii. Keď pole premenuješ alebo zmažeš, už vyplnený text sa nestratí, len sa prestane zobrazovať.</span>
      <div class="btnrow"><button class="btn primary" id="cDone">Hotovo</button><button class="btn" id="cAddEnt">${I.plus}Pridať záznam do kategórie</button></div>
    </div>
    <div>${conf ? `<div class="confirm"><b>Zmazať kategóriu „${esc(c.name)}“?</b><span>${n ? `${n} ${plural(n, "záznam sa presunie", "záznamy sa presunú", "záznamov sa presunie")} do Poznámok, nič sa nestratí.` : "Kategória je prázdna."}</span><div class="btnrow"><button class="btn sm danger solid" id="cDelYes">Zmazať</button><button class="btn sm" id="cDelNo">Ponechať</button></div></div>` : `<button class="btn sm danger" id="cDel">${I.trash}Zmazať kategóriu</button>`}</div>
  </div>`;
  const upd = debounce(() => { setCats(p.customCats); saveProject(); renderCatList(); }, 250);
  $("#toList").onclick = () => { S.catEdit = null; S.worldPane = "list"; renderWorld($("#main")); };
  $("#cName").oninput = e => { c.name = e.target.value || "Bez názvu"; upd(); };
  $("#cOne").oninput = e => { c.one = e.target.value; upd(); };
  $("#cFields").oninput = e => { c.fields = [...new Set(e.target.value.split("\n").map(x => x.trim()).filter(Boolean))]; upd(); };
  $$("[data-col]", el).forEach(b => b.onclick = () => { c.color = b.dataset.col; $$(".sw", el).forEach(x => x.classList.toggle("on", x === b)); el.querySelector(".ehead").style.setProperty("--cc", c.color); upd(); });
  $("#cDone").onclick = () => { upd.now(); S.catEdit = null; S.worldPane = "list"; renderWorld($("#main")); };
  $("#cAddEnt").onclick = () => { upd.now(); S.catEdit = null; newEnt(c.id); renderWorld($("#main")); setTimeout(() => $("#eName")?.focus(), 30); };
  $("#cDel")?.addEventListener("click", () => { S.confirm = { type: "cat", id: c.id }; renderCatEditor(el); });
  $("#cDelNo")?.addEventListener("click", () => { S.confirm = null; renderCatEditor(el); });
  $("#cDelYes")?.addEventListener("click", () => {
    Object.values(S.ents).forEach(e => { if (e.cat === c.id) { e.cat = "poznamka"; saveEnt(e.id); } });
    p.customCats = p.customCats.filter(x => x.id !== c.id); setCats(p.customCats); S.graph.off.delete(c.id);
    S.catEdit = null; S.confirm = null; S.cat = "all"; S.worldPane = "list"; saveProject(); renderWorld($("#main")); toast("Kategória bola zmazaná.");
  });
}
function renderEList() {
  const el = $("#elist"); if (!el) return;
  const q = norm(S.eq.trim());
  let list = entsBy(S.cat);
  if (q) list = list.filter(e => norm(e.name + " " + (e.forms || []).join(" ") + " " + e.summary + " " + Object.values(e.fields || {}).join(" ") + " " + (e.tags || []).join(" ")).includes(q));
  el.innerHTML = list.length ? list.map(e => `<button class="ecard${S.ent === e.id ? " sel" : ""}" data-ent="${e.id}" style="--cc:${catColor(e.cat)}">
      ${S.cat === "all" || keyFieldOf(e)?.v ? `<span class="ek">${esc([S.cat === "all" ? CAT[e.cat]?.one : "", keyFieldOf(e)?.v].filter(Boolean).join(" · "))}</span>` : ""}<span class="en">${esc(e.name || "Bez mena")}</span>${e.summary ? `<span class="es">${esc(e.summary)}</span>` : ""}</button>`).join("")
    : `<div class="empty">${q ? "Nič sa nenašlo." : "Zatiaľ prázdne. Pridaj prvý záznam tlačidlom Nový."}</div>`;
  $$("[data-ent]", el).forEach(b => b.onclick = () => { S.catEdit = null; S.ent = b.dataset.ent; S.worldPane = "detail"; S.confirm = null; $("#world").className = "world m-detail"; $$(".ecard", el).forEach(x => x.classList.toggle("sel", x === b)); renderEDetail(); });
}
function entLinks(id) { return (S.p.links || []).filter(l => (l.a === id || l.b === id) && S.ents[l.a] && S.ents[l.b]); }
function renderEDetail() {
  const el = $("#edetail"); if (!el) return;
  if (S.catEdit) return renderCatEditor(el);
  const e = S.ent && S.ents[S.ent];
  if (!e) {
    el.innerHTML = `<div class="bigempty"><h3>Svet tvojho príbehu</h3><p style="max-width:46ch">Zapisuj krajiny, postavy, náboženstvá, magické systémy, rody a artefakty. Prepoj ich vzťahmi a v sekcii Vzťahy uvidíš celú sieť alebo strom.</p><button class="btn primary" id="emptyEnt">${I.plus}Pridať záznam</button></div>`;
    $("#emptyEnt").onclick = () => { newEnt(S.cat); renderWorld($("#main")); };
    return;
  }
  const cat = CAT[e.cat] || CAT.poznamka;
  const fields = cat.fields.map((f, i) => { const fn = fieldName(f), v = e.fields?.[fn] || "";
    if (typeof f === "object" && f.opts) return `<label class="field keyfield${f.key && !v ? " need" : ""}"><span>${esc(fn)}${f.key ? " *" : ""}</span><input class="inp" list="fo-${i}" data-field="${esc(fn)}" value="${esc(v)}" placeholder="Vyber alebo napíš vlastný" autocomplete="off"><datalist id="fo-${i}">${f.opts.map(x => `<option value="${esc(x)}">`).join("")}</datalist>${f.key && !v ? `<small class="hint">Povinné pole – vyplň ho.</small>` : ""}</label>`;
    return `<label class="field"><span>${esc(fn)}</span><textarea class="inp" rows="1" data-field="${esc(fn)}">${esc(v)}</textarea></label>`; }).join("");
  const custom = (e.custom || []).map((c, i) => `<div class="field"><div class="fx"><input class="inp" data-cl="${i}" value="${esc(c.label)}" placeholder="Názov poľa" style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px"><button data-crm="${i}" title="Odstrániť pole">×</button></div><textarea class="inp" rows="1" data-cv="${i}">${esc(c.value || "")}</textarea></div>`).join("");
  const links = entLinks(e.id);
  const relRow = l => {
    const out = l.a === e.id, other = S.ents[out ? l.b : l.a];
    if (S.relEdit === l.id) return `<div class="relform"><div class="fgrid">
        <label class="field"><span>Vzťah ${out ? "(" + esc(e.name || "tento") + " → " + esc(other.name) + ")" : "(" + esc(other.name) + " → " + esc(e.name || "tento") + ")"}</span><input class="inp" id="reLabel" value="${esc(l.label)}" list="reSug" autocomplete="off"><datalist id="reSug">${relSuggest(S.ents[l.a].cat, S.ents[l.b].cat).map(x => `<option value="${esc(x)}">`).join("")}</datalist></label>
        <label class="field"><span>Kedy (voliteľné)</span><input class="inp" id="reWhen" value="${esc(l.when || "")}" placeholder="napr. do kapitoly 7, pred vojnou, od Noci veží" autocomplete="off"></label></div>
      <label class="chk"><input type="checkbox" id="rePast"${l.past ? " checked" : ""}> Vzťah už neplatí (minulý)</label>
      <div class="btnrow"><button class="btn sm primary" id="reSave">Uložiť</button><button class="btn sm" id="reCancel">Zrušiť</button></div></div>`;
    return `<div class="rel${l.past ? " past" : ""}"><button class="lab" data-reledit="${l.id}" title="Upraviť vzťah">${out ? esc(l.label) + " →" : "← " + esc(l.label)}</button>
      <button class="tgt" data-goent="${other.id}"><span class="cd" style="background:${catColor(other.cat)}"></span><span>${esc(other.name || "Bez mena")}</span><small class="hint">${esc(CAT[other.cat]?.one || "")}${l.when ? " · " + esc(l.when) : ""}</small></button>
      <button class="btn sm ghost pastbtn" data-relpast="${l.id}" title="${l.past ? "Označiť znova ako aktuálny" : "Označiť ako neaktuálny – vzťah už neplatí"}">${l.past ? "minulý" : "aktuálny"}</button>
      <button class="btn icon ghost" data-rmlink="${l.id}" title="Odstrániť prepojenie">×</button></div>`;
  };
  const curL = links.filter(l => !l.past), pastL = links.filter(l => l.past);
  const rels = curL.map(relRow).join("") + (pastL.length ? `<div class="relsep">Minulé vzťahy · ${pastL.length}</div>` + pastL.map(relRow).join("") : "");
  // occurrences
  const occ = []; let mentionTotal = 0;
  allTexts().forEach(n => {
    const why = [];
    if (n.pov === e.id) why.push("rozprávač"); if (n.place === e.id) why.push("miesto deja"); if ((n.ents || []).includes(e.id)) why.push("priradené");
    const m = e.name && e.name.trim().length > 1 ? findMentions(e, S.items[n.id]?.html) : null;
    if (m) { why.push("v texte " + m.count + "×"); mentionTotal += m.count; }
    if (why.length) occ.push({ n, why, snip: m ? m.snippet : "" });
  });
  const sugg = suggestForms(e);
  const conf = S.confirm && S.confirm.type === "ent" && S.confirm.id === e.id;
  el.innerHTML = `<div class="edetail-in">
    <div class="ehead" style="--cc:${catColor(e.cat)}">
      <div class="kind"><button class="btn icon ghost backbtn" id="toList" title="Späť na zoznam">${I.back}</button>
        <span class="badge">${esc(cat.one)}</span>${keyFieldOf(e) ? `<span class="badge soft" id="keyBadge"${keyFieldOf(e).v ? "" : " hidden"}>${esc(keyFieldOf(e).v)}</span>` : ""}
        <select class="inp" id="eCat" style="width:auto;font-size:12px;padding:3px 6px" aria-label="Kategória">${CATS.map(c => `<option value="${c.id}"${c.id === e.cat ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
        <span class="spacer" style="flex:1"></span>
        <button class="btn sm" id="eGraph">${I.net}Ukázať vo vzťahoch</button></div>
      <input class="ename" id="eName" value="${esc(e.name)}" placeholder="Meno / názov" aria-label="Meno">
      <textarea class="esum" id="eSum" rows="1" placeholder="Jednou vetou: kto alebo čo to je?">${esc(e.summary || "")}</textarea>
    </div>
    <div class="card"><h3>Vlastnosti<span class="spacer"></span><button class="btn sm ghost" id="addField">${I.plus}Vlastné pole</button></h3>
      ${fields || custom ? `<div class="fgrid">${fields}${custom}</div>` : '<div class="empty">Táto kategória nemá predvolené polia. Pridaj si vlastné.</div>'}</div>
    <div class="card"><h3>Prepojenia <span class="mono" style="letter-spacing:0">${curL.length || ""}</span></h3>
      <div class="rels">${rels || '<div class="empty">Zatiaľ bez prepojení. Napríklad: postava → ovláda → mágia.</div>'}</div>
      <div class="addrel">
        <input class="inp" id="relLabel" list="relSug" placeholder="Vzťah (napr. ovláda)" autocomplete="off">
        <select class="inp" id="relTarget"><option value="">Vyber záznam…</option>${allEntOptions([e.id])}</select>
        <button class="btn primary" id="relAdd">${I.link}Prepojiť</button>
      </div><datalist id="relSug"></datalist>
      <span class="hint">Smer: <b>${esc(e.name || "tento záznam")}</b> → vzťah → vybraný záznam. Keď sa vzťah zmení (postava odíde, pohádajú sa), klikni na „aktuálny“ a označ ho ako minulý; potom pridaj nový vzťah.</span>
    </div>
    <div class="card"><h3>Tvary mena a prezývky <span class="mono" style="letter-spacing:0">${(e.forms || []).length || ""}</span></h3>
      <div class="chips">${(e.forms || []).map((f, i) => `<span class="chip">${esc(f)}<button class="x" data-rmform="${i}" aria-label="Odobrať tvar">×</button></span>`).join("") || '<span class="hint">Zatiaľ len základný tvar. Pridaj skloňované tvary, prezývky či tituly, podľa ktorých ho Kronikár nájde v texte.</span>'}</div>
      <div class="addrel" style="grid-template-columns:minmax(0,1fr) auto"><input class="inp" id="formIn" placeholder="Napr. Ilsou, Ilsy, malá Vranová (viac oddeľ čiarkou)" autocomplete="off"><button class="btn" id="formAdd">${I.plus}Pridať</button></div>
      ${sugg.length ? `<div class="sugg"><span class="lbl">Návrhy skloňovania</span><div class="chips">${sugg.map(f => `<button class="chip link sg" data-addform="${esc(f)}">+ ${esc(f)}</button>`).join("")}</div><div class="btnrow"><button class="btn sm" id="formAll">Pridať všetky návrhy</button><span class="hint">Návrhy sú automatické – pridaj len tie správne.</span></div></div>` : ""}
    </div>
    <div class="card" data-refcount><h3>Odkazy <span class="rc mono" style="letter-spacing:0"></span></h3><div id="eRefs"></div><span class="hint">Napríklad inšpirácia na Instagrame, hudba na YouTube či Spotify, mapy, obrázky.</span></div>
    <div class="card"><h3>Poznámky</h3><div class="notes-ed" id="eNotes" contenteditable="true" lang="${bookLang()}" data-ph="${esc(tl("Dejiny, legendy, nápady, citáty… všetko, čo sa nezmestí do políčok."))}"></div></div>
    <div class="card"><h3>V rukopise${mentionTotal ? ` <span class="mono" style="letter-spacing:0">${mentionTotal}×</span>` : ""}</h3>${occ.length ? `<div class="occ">${occ.map(o => `<button data-goscene="${o.n.id}" class="occrow"><span class="ot">${esc(o.n.title)} <small>${o.why.join(" · ")}</small></span>${o.snip ? `<span class="osnip">${esc(o.snip).replace("«", "<mark>").replace("»", "</mark>")}</span>` : ""}</button>`).join("")}</div>` : '<div class="empty">Zatiaľ sa v rukopise nespomína.</div>'}</div>
    <div>${conf ? `<div class="confirm"><b>Zmazať „${esc(e.name || "záznam")}“?</b><span>Odstránia sa aj ${links.length} ${plural(links.length, "prepojenie", "prepojenia", "prepojení")}.</span><div class="btnrow"><button class="btn sm danger solid" id="eDelYes">Zmazať</button><button class="btn sm" id="eDelNo">Ponechať</button></div></div>` : `<button class="btn sm danger" id="eDel">${I.trash}Zmazať záznam</button>`}</div>
  </div>`;
  const notes = $("#eNotes"); notes.innerHTML = e.notes || "";
  const sv = debounce(() => saveEnt(e.id), 600);
  const listRefresh = debounce(renderEList, 300);
  $("#toList").onclick = () => { S.worldPane = "list"; $("#world").className = "world m-list"; };
  $("#eName").oninput = ev => { e.name = ev.target.value; sv(); listRefresh(); };
  const sum = $("#eSum"); autoGrow(sum); sum.oninput = () => { e.summary = sum.value; autoGrow(sum); sv(); listRefresh(); };
  $("#eCat").onchange = ev => { e.cat = ev.target.value; saveEnt(e.id); renderWorld($("#main")); };
  $$("[data-field]", el).forEach(t => { const ta = t.tagName === "TEXTAREA"; if (ta) autoGrow(t); t.oninput = () => { e.fields = e.fields || {}; e.fields[t.dataset.field] = t.value; if (ta) autoGrow(t); else { const lf = t.closest(".keyfield"); if (lf) { lf.classList.toggle("need", !t.value.trim()); const kb = $("#keyBadge"); if (kb) { kb.textContent = t.value; kb.hidden = !t.value.trim(); } } listRefresh(); } sv(); }; });
  $$("[data-cv]", el).forEach(t => { autoGrow(t); t.oninput = () => { e.custom[+t.dataset.cv].value = t.value; autoGrow(t); sv(); }; });
  $$("[data-cl]", el).forEach(t => t.oninput = () => { e.custom[+t.dataset.cl].label = t.value; sv(); });
  $$("[data-crm]", el).forEach(b => b.onclick = () => { e.custom.splice(+b.dataset.crm, 1); saveEnt(e.id); renderEDetail(); });
  $("#addField").onclick = () => { e.custom = e.custom || []; e.custom.push({ label: "", value: "" }); saveEnt(e.id); renderEDetail(); setTimeout(() => $(`[data-cl="${e.custom.length - 1}"]`)?.focus(), 20); };
  mountRefs($("#eRefs"), e, () => saveEnt(e.id), false);
  const fIn = $("#formIn");
  const addF = list => { const n = addForms(e, list); if (n) { renderEDetail(); toast(n === 1 ? "Tvar pridaný." : n + " tvarov pridaných."); setTimeout(() => $("#formIn")?.focus(), 30); } else toast("Tieto tvary už má."); };
  $("#formAdd").onclick = () => addF(fIn.value.split(","));
  fIn.onkeydown = ev => { if (ev.key === "Enter") addF(fIn.value.split(",")); };
  $$("[data-addform]", el).forEach(b => b.onclick = () => addF([b.dataset.addform]));
  $("#formAll")?.addEventListener("click", () => addF(sugg));
  $$("[data-rmform]", el).forEach(b => b.onclick = () => { e.forms.splice(+b.dataset.rmform, 1); saveEnt(e.id); renderEDetail(); });
  notes.oninput = () => { e.notes = cleanEditorHtml(notes.innerHTML); sv(); };
  notes.addEventListener("paste", ev => { ev.preventDefault(); const h = ev.clipboardData.getData("text/html"), t = ev.clipboardData.getData("text/plain"); document.execCommand("insertHTML", false, h ? sanitizeHtml(h) : t.split(/\r?\n/).filter(x => x.trim()).map(p => "<p>" + esc(p) + "</p>").join("")); });
  const tgt = $("#relTarget"), lab = $("#relLabel"), dl = $("#relSug");
  const sug = () => { const o = S.ents[tgt.value]; dl.innerHTML = relSuggest(e.cat, o ? o.cat : "").map(s => `<option value="${esc(s)}">`).join(""); };
  sug(); tgt.onchange = sug;
  $("#relAdd").onclick = () => {
    if (!tgt.value) { toast("Vyber, s čím chceš záznam prepojiť."); tgt.focus(); return; }
    const label = lab.value.trim() || "súvisí s";
    S.p.links.push({ id: uid("l"), a: e.id, b: tgt.value, label }); saveProject(); renderEDetail(); toast("Prepojené.");
  };
  $$("[data-relpast]", el).forEach(b => b.onclick = () => { const l = S.p.links.find(x => x.id === b.dataset.relpast); if (!l) return; l.past = !l.past; if (l.past && !l.when) { S.relEdit = l.id; } saveProject(); renderEDetail(); if (S.relEdit) setTimeout(() => $("#reWhen")?.focus(), 30); });
  $$("[data-reledit]", el).forEach(b => b.onclick = () => { S.relEdit = b.dataset.reledit; renderEDetail(); setTimeout(() => $("#reLabel")?.focus(), 30); });
  $("#reCancel")?.addEventListener("click", () => { S.relEdit = null; renderEDetail(); });
  const reSave = () => { const l = S.p.links.find(x => x.id === S.relEdit); if (l) { l.label = $("#reLabel").value.trim() || l.label; l.when = $("#reWhen").value.trim(); l.past = $("#rePast").checked; saveProject(); } S.relEdit = null; renderEDetail(); };
  $("#reSave")?.addEventListener("click", reSave);
  ["#reLabel", "#reWhen"].forEach(id => $(id)?.addEventListener("keydown", ev => { if (ev.key === "Enter") reSave(); }));
  $$("[data-rmlink]", el).forEach(b => b.onclick = () => { S.p.links = S.p.links.filter(l => l.id !== b.dataset.rmlink); saveProject(); renderEDetail(); });
  $$("[data-goent]", el).forEach(b => b.onclick = () => { S.ent = b.dataset.goent; S.confirm = null; renderEList(); renderEDetail(); $("#edetail").scrollTop = 0; });
  $$("[data-goscene]", el).forEach(b => b.onclick = () => { S.sel = b.dataset.goscene; S.mode = "write"; $$("[data-mode]").forEach(x => x.classList.toggle("on", x.dataset.mode === "write")); renderMode(); });
  $("#eGraph").onclick = () => { S.graph.sel = e.id; S.graph.root = e.id; S.mode = "graph"; $$("[data-mode]").forEach(x => x.classList.toggle("on", x.dataset.mode === "graph")); renderMode(); };
  $("#eDel")?.addEventListener("click", () => { S.confirm = { type: "ent", id: e.id }; renderEDetail(); });
  $("#eDelNo")?.addEventListener("click", () => { S.confirm = null; renderEDetail(); });
  $("#eDelYes")?.addEventListener("click", () => deleteEnt(e.id));
}
function deleteEnt(id) {
  delete S.ents[id]; qdel(entPath(S.p.id, id));
  S.p.links = S.p.links.filter(l => l.a !== id && l.b !== id);
  delete (S.p.graphPos || {})[id];
  allTexts().forEach(n => { if (n.pov === id) n.pov = null; if (n.place === id) n.place = null; if (n.ents) n.ents = n.ents.filter(x => x !== id); });
  S.ent = null; S.confirm = null; S.worldPane = "list"; saveProject();
  if (S.mode === "world") renderWorld($("#main")); toast("Záznam bol zmazaný.");
}
</script>
