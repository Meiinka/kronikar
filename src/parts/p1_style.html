<title>Kronikár</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Tinos:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Arimo:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Raleway:wght@300;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,600&display=swap&subset=latin-ext">
<style>
/* Layout: one-screen writing studio — top bar, then a three-pane workspace (binder · page · inspector) that collapses to one pane on phones */
:root{
  --bg:#E8EBEF; --panel:#F6F7F9; --paper:#FFFFFF; --ink:#1B2130; --ink-2:#596276; --ink-3:#8790A1;
  --line:#D3D8E0; --line-2:#E3E7EC; --hover:#EDF0F3;
  --accent:#2E6B66; --accent-ink:#FFFFFF; --accent-soft:#D8EAE6; --danger:#A33A3A; --danger-soft:#F6E1E1; --warn:#946812;
  --c-krajina:#4A7A3A; --c-postava:#35589C; --c-rasa:#B0457A; --c-nabozenstvo:#86529A; --c-bozstvo:#4F55C9; --c-magia:#B4592A; --c-frakcia:#9C3550; --c-predmet:#94761A; --c-udalost:#3F7889; --c-poznamka:#646A75;
  --st-napad:#8790A1; --st-koncept:#B4802A; --st-revizia:#3F7889; --st-hotovo:#3E8A4E;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.06);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#161A21; --paper:#1B2028; --ink:#E3E6EB; --ink-2:#9BA4B3; --ink-3:#6D7686;
  --line:#2A303A; --line-2:#222831; --hover:#1F242D;
  --accent:#72B8AD; --accent-ink:#0D1513; --accent-soft:#1D3431; --danger:#E07B7B; --danger-soft:#3A2020; --warn:#D9A74A;
  --c-krajina:#86B874; --c-postava:#7FA3E6; --c-rasa:#E58AB6; --c-nabozenstvo:#C394D4; --c-bozstvo:#A3A8F2; --c-magia:#E9935F; --c-frakcia:#E07A93; --c-predmet:#D8B858; --c-udalost:#7EBBCB; --c-poznamka:#A2A8B3;
  --st-napad:#6D7686; --st-koncept:#D9A74A; --st-revizia:#7EBBCB; --st-hotovo:#79C287;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#161A21; --paper:#1B2028; --ink:#E3E6EB; --ink-2:#9BA4B3; --ink-3:#6D7686;
  --line:#2A303A; --line-2:#222831; --hover:#1F242D;
  --accent:#72B8AD; --accent-ink:#0D1513; --accent-soft:#1D3431; --danger:#E07B7B; --danger-soft:#3A2020; --warn:#D9A74A;
  --c-krajina:#86B874; --c-postava:#7FA3E6; --c-rasa:#E58AB6; --c-nabozenstvo:#C394D4; --c-bozstvo:#A3A8F2; --c-magia:#E9935F; --c-frakcia:#E07A93; --c-predmet:#D8B858; --c-udalost:#7EBBCB; --c-poznamka:#A2A8B3;
  --st-napad:#6D7686; --st-koncept:#D9A74A; --st-revizia:#7EBBCB; --st-hotovo:#79C287;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.icon{padding:5px 7px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent)}
.btn svg,button svg:not(.brand-mark){width:15px;height:15px;flex:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span,.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 9px;font-size:13.5px;min-width:0}
textarea.inp{resize:vertical;min-height:60px;line-height:1.5}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.hint{color:var(--ink-3);font-size:12px}
.muted{color:var(--ink-2)}

/* ---------- top bar ---------- */
.topbar{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:6px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.01em;white-space:nowrap;background:none;border:0;padding:0}
.brand-mark{width:26px;height:26px;flex:none}
.crumb{font-family:var(--f-display);font-size:16px;font-style:italic;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 12px;border-radius:6px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.langsel{width:auto;padding:4px 6px;font-size:12px}
.goalbox{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.goal{display:flex;flex-direction:column;gap:3px;min-width:110px}
.goal .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.savestate{font-size:12px;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:6px}
.savestate .dot{width:7px;height:7px;border-radius:50%;background:var(--st-hotovo)}
.savestate.busy .dot{background:var(--warn)}
.savestate.err{color:var(--danger)}.savestate.err .dot{background:var(--danger)}

/* ---------- home ---------- */
.home{flex:1;overflow:auto;padding-block:32px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.home-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between}
.home-head h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4vw,36px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.home-head p{margin:4px 0 0;color:var(--ink-2);max-width:60ch}
.home-actions{display:flex;flex-wrap:wrap;gap:8px}
.notice{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.notice.sync{align-items:center;flex-wrap:wrap}
.notice.sync.ok{border-color:color-mix(in srgb,var(--st-hotovo) 45%,var(--line))}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--st-hotovo);flex:none}
.savestate .btn{padding:1px 7px;font-size:11.5px}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;min-height:190px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.pcard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.pcard .spine{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0}
.pcard h3{font-family:var(--f-display);font-size:21px;font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
.pcard .genre{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.pcard .stats{margin-top:auto;display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.pcard .stats b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.pcard .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.pcard .bar i{display:block;height:100%;background:var(--accent)}
.newcard{border-style:dashed;box-shadow:none;align-items:center;justify-content:center;color:var(--ink-2);background:transparent}
.newcard:hover{color:var(--accent)}
.form-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;box-shadow:var(--shadow)}
.form-card .row-end{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty-hero{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:34px 28px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center}
.empty-hero h2{font-family:var(--f-display);font-size:26px;margin:0 0 8px;font-weight:600}
.empty-hero ul{margin:12px 0 18px;padding-left:18px;color:var(--ink-2);display:grid;gap:4px}
@media (max-width:720px){.empty-hero{grid-template-columns:1fr}}

/* ---------- workspace ---------- */
.ws{flex:1;display:grid;min-height:0;grid-template-columns:270px minmax(0,1fr) 300px}
.ws.no-insp{grid-template-columns:270px minmax(0,1fr)}
.ws.no-insp .pane.right{display:none}
.pane{min-height:0;overflow:auto;background:var(--panel)}
.pane.left{border-right:1px solid var(--line);display:flex;flex-direction:column}
.pane.right{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}
.pane.center{background:var(--bg);position:relative;display:flex;flex-direction:column}
.pane-head{display:flex;align-items:center;gap:6px;padding:10px 10px 8px 12px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel);z-index:2}
.pane-head .lbl{flex:1}
.searchbox{margin:8px 10px 4px;position:relative}
.searchbox input{padding-left:28px}
.searchbox svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3)}

/* binder */
.binder{padding:6px 6px 30px;flex:1;outline:none}
.bnode{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px;cursor:pointer;user-select:none;position:relative;border:1px solid transparent;min-height:30px}
.bnode:hover{background:var(--hover)}
.bnode.sel{background:var(--accent-soft);color:var(--ink)}
.bnode .tw{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--ink-3);border:0;background:none;padding:0;border-radius:3px}
.bnode .tw svg{width:12px;height:12px;transition:transform .12s}
.bnode.closed .tw svg{transform:rotate(-90deg)}
.bnode .ic{width:15px;height:15px;flex:none;color:var(--ink-3)}
.bnode.folder .ic{color:var(--accent)}
.bnode .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnode.folder>.t{font-weight:600}
.bnode.part>.t{font-family:var(--f-display);font-style:italic;font-weight:600}
.bnode .w{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.bnode .st{width:7px;height:7px;border-radius:50%;flex:none}
.bnode.excl>.t{color:var(--ink-3);text-decoration:line-through}
.bnode.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.bnode.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.bnode.drop-into{border-color:var(--accent);background:var(--accent-soft)}
.bnode.dragging{opacity:.4}
.bkids{margin-left:14px;border-left:1px solid var(--line-2);padding-left:2px}
.binder-foot{padding:10px 12px;border-top:1px solid var(--line-2);display:flex;gap:6px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel)}

/* editor */
.edbar{display:flex;align-items:center;gap:4px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;position:sticky;top:0;z-index:3}
.edbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.edbar .wc{margin-left:auto;font-size:12px;color:var(--ink-2)}
.edscroll{flex:1;overflow:auto;padding:34px 16px 120px}
.page{max-width:720px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:56px clamp(22px,7vw,78px) 80px;min-height:70vh}
.page-title{font-family:var(--f-display);font-size:28px;font-weight:600;border:0;background:none;width:100%;padding:0;margin:0 0 22px;outline:none;letter-spacing:-.01em}
.page-title::placeholder{color:var(--ink-3)}
.editor{font-family:var(--f-display);font-size:var(--ed-size,18px);line-height:1.75;outline:none;min-height:50vh;word-wrap:break-word}
.editor p{margin:0 0 .15em;text-indent:1.4em}
.editor p:first-child,.editor p.sb+p,.editor h2+p,.editor h3+p,.editor blockquote+p{text-indent:0}
.editor p.sb,.editor p[style*="center"]{text-indent:0;text-align:center}
.editor p.sb{margin:1em 0;letter-spacing:.4em;color:var(--ink-2)}
.editor blockquote{margin:.6em 1.6em;font-style:italic;color:var(--ink-2)}
.editor h2,.editor h3{font-weight:600;margin:1em 0 .4em}
.editor:empty::before{content:attr(data-ph);color:var(--ink-3);font-style:italic}
.focus .topbar,.focus .pane.left,.focus .pane.right{display:none}
.focus .ws{grid-template-columns:minmax(0,1fr)!important}
.focus .edbar{opacity:.25;transition:opacity .2s}.focus .edbar:hover{opacity:1}
.focus .page{border-color:transparent;box-shadow:none;background:transparent}

/* corkboard */
.cork{flex:1;overflow:auto;padding:24px clamp(16px,3vw,32px) 80px}
.cork-head{max-width:1100px;margin:0 auto 18px;display:flex;flex-direction:column;gap:10px}
.cork-head .page-title{margin:0;font-size:30px}
.cork-head .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cards{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.icard{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:6px;min-height:150px;box-shadow:var(--shadow);cursor:pointer;position:relative;text-align:left}
.icard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.icard .ct{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.25;display:flex;gap:7px;align-items:baseline}
.icard .ct .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-weight:400}
.icard .syn{font-size:13px;color:var(--ink-2);flex:1;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.icard .syn.none{font-style:italic;color:var(--ink-3)}
.icard .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--ink-3);border-top:1px solid var(--line-2);padding-top:6px}
.icard .stripe{position:absolute;top:0;left:0;right:0;height:3px;border-radius:6px 6px 0 0}
.icard.drop-before{box-shadow:-3px 0 0 var(--accent)}
.icard.drop-after{box-shadow:3px 0 0 var(--accent)}
.icard.add{border-style:dashed;box-shadow:none;background:transparent;align-items:center;justify-content:center;color:var(--ink-2)}
.readthrough{max-width:720px;margin:0 auto}
.readthrough h4{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 10px;text-align:center}

/* inspector */
.insp-sec{display:flex;flex-direction:column;gap:8px}
.insp-sec+.insp-sec{border-top:1px solid var(--line-2);padding-top:14px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:15px}
.stat span{font-size:11px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 4px 2px 9px;font-size:12.5px;max-width:100%}
.chip .cd{width:8px;height:8px;border-radius:50%;flex:none}
.chip .x{border:0;background:none;padding:0 4px;color:var(--ink-3);font-size:15px;line-height:1}
.chip .x:hover{color:var(--danger)}
.chip.link{cursor:pointer;padding-right:9px}
.chip.link:hover{border-color:var(--accent)}
.status-pick{display:flex;gap:4px;flex-wrap:wrap}
.status-pick button{border:1px solid var(--line);background:var(--paper);border-radius:999px;font-size:12px;padding:3px 9px;display:flex;align-items:center;gap:5px}
.status-pick button i{width:7px;height:7px;border-radius:50%}
.status-pick button.on{border-color:var(--ink-2);font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.confirm{border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));background:var(--danger-soft);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px}

/* world */
.world{flex:1;display:grid;grid-template-columns:200px 290px minmax(0,1fr);min-height:0}
.catlist{padding:8px;display:flex;flex-direction:column;gap:2px}
.catbtn{display:flex;align-items:center;gap:9px;border:0;background:none;padding:7px 9px;border-radius:6px;text-align:left;font-weight:500;color:var(--ink-2)}
.catbtn:hover{background:var(--hover);color:var(--ink)}
.catbtn.on{background:var(--accent-soft);color:var(--ink)}
.catbtn .cd{width:9px;height:9px;border-radius:2px;flex:none;transform:rotate(45deg)}
.catbtn .ed{border:0;background:none;padding:0 2px;color:var(--ink-3);display:none}
.catbtn:hover .ed,.catbtn.on .ed{display:inline-flex}
.catbtn .ed:hover{color:var(--accent)}
.catbtn.add{color:var(--ink-3);font-weight:400;margin-top:6px;border:1px dashed var(--line)}
.refs{display:flex;flex-direction:column;gap:6px}
.refs:empty{display:none}
.ref{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;align-items:center;border:1px solid var(--line-2);background:var(--paper);border-radius:7px;padding:5px 4px 5px 7px}
.ref .thumb{width:58px;height:33px;object-fit:cover;border-radius:4px;display:block;background:var(--line-2)}
.rbadge{display:inline-block;font:600 10px/1 var(--f-ui);letter-spacing:.04em;color:#fff;background:var(--rc,var(--ink-3));border-radius:4px;padding:4px 5px;min-width:30px;text-align:center}
.rmid{min-width:0;display:flex;flex-direction:column}
