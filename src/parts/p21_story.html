const MONTHS_SK = ["január", "február", "marec", "apríl", "máj", "jún", "júl", "august", "september", "október", "november", "december"];

function readTime(box) { const y = $(".ty", box).value.trim(); if (y === "" || !isFinite(+y)) return null; const m = +$(".tm", box).value || undefined, d = m ? (+$(".td", box).value || undefined) : undefined; const c = cal(); return Object.assign({ y: Math.round(+y) }, m ? { m } : {}, d ? { d: Math.min(c.mdays, Math.max(1, d)) } : {}); }

/* ---------- character arc ---------- */

function arcGroups() {
  const out = [], by = new Map(), chapNo = new Map();
  bookStructure().forEach(s => { if (s.type === "chapter" && s.node && !s.loose) chapNo.set(s.node.id, s.n); });

    if (n.type !== "text" || n.include === false) return;

    }
    x.texts.push(n); if (x.part && chapNo.has(n.id)) x.nums.push(chapNo.get(n.id));

  return out;
}
function presentIn(e, texts) { return texts.some(t => t.pov === e.id || (t.ents || []).includes(e.id) || mentions(e, S.items[t.id]?.html)); }

/* position of every scene and chapter in the book as a share 0–1 (by words) */

}
