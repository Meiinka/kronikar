/* ================= storage ================= */
const Store = {
  mode: "local", db: null, uid: null, prefix: "",
  async init() {
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db && user) {
          const id = await user.id();
          if (id) { this.db = db; this.uid = id; this.mode = "cloud"; this.prefix = "data/users/" + id + "/profile/"; }
        }
      }
    } catch (e) { console.warn("db init", e); }
  },
  lsKey: p => "kronikar:" + p,
  async get(path) {
    if (this.mode === "cloud") { const s = await this.db.doc(this.prefix + path).get(); return s.exists ? clone(s.data()) : null; }
    try { const v = localStorage.getItem(this.lsKey(path)); return v ? JSON.parse(v) : null; } catch { return null; }
  },
  async set(path, data) {
    if (this.mode === "cloud") return this.db.doc(this.prefix + path).set(data);
    try { localStorage.setItem(this.lsKey(path), JSON.stringify(data)); } catch (e) { throw { code: "quota_exceeded", message: String(e) }; }
  },
  async del(path) {
    if (this.mode === "cloud") return this.db.doc(this.prefix + path).delete();
    try { localStorage.removeItem(this.lsKey(path)); } catch { }
  },
  async list(col) {
    if (this.mode === "cloud") { const q = await this.db.collection(this.prefix + col).get(); return q.docs.filter(d => d.exists).map(d => ({ id: d.id, ...clone(d.data()) })); }
    const pre = this.lsKey(col + "/"), out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(pre) && !k.slice(pre.length).includes("/")) { try { out.push({ id: k.slice(pre.length), ...JSON.parse(localStorage.getItem(k)) }); } catch { } }
      }
    } catch { }
    return out;
  },
};

/* write queue: one in-flight write per document, latest state wins */
const Q = { pending: new Map(), inflight: new Set(), timer: null, err: null };
function qset(path, getData) { Q.pending.set(path, { getData }); schedFlush(); }
function qdel(path) { Q.pending.set(path, { del: true }); schedFlush(); }
function schedFlush(ms = 900) { setSave("busy"); clearTimeout(Q.timer); Q.timer = setTimeout(flush, ms); }
async function flush() {
  clearTimeout(Q.timer);
  const jobs = [...Q.pending.entries()].filter(([p]) => !Q.inflight.has(p));
  await Promise.all(jobs.map(async ([path, job]) => {
    Q.pending.delete(path); Q.inflight.add(path);
    try {
      if (job.del) await Store.del(path); else { const d = job.getData(); if (d) await Store.set(path, d); }
      Q.err = null;
    } catch (e) {
      console.error("save", path, e);
      Q.err = e;
      if (!Q.pending.has(path) && e && e.code === "unavailable") Q.pending.set(path, job);
    } finally { Q.inflight.delete(path); }
  }));
  if (Q.pending.size) schedFlush(Q.err ? 4000 : 300); else { setSave(Q.err ? "err" : "ok"); if (S.p && typeof Sync !== "undefined") Sync.schedule(S.p.id); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
function setSave(s) {
  const el = $("#savestate"); if (!el) return;
  el.className = "savestate" + (s === "busy" ? " busy" : s === "err" ? " err" : "");
  const sy = typeof Sync !== "undefined" && Store.mode !== "cloud" ? Sync : null;
  const where = Store.mode === "cloud" ? "v cloude" : sy && sy.state === "ok" ? "do priečinka " + sy.name : "v prehliadači";
  el.innerHTML = '<span class="dot"></span>' + (s === "busy" ? "Ukladám…" : s === "err" ? (Q.err && Q.err.code === "quota_exceeded" ? "Úložisko je plné" : "Neuložené – skúšam znova") : "Uložené " + where) +
    (sy && sy.state === "need" && s !== "busy" ? ' · <button class="btn sm" id="syncGrantTop">Povoliť priečinok</button>' : "") +
    (sy && sy.state === "ok" && sy.err && s !== "busy" ? ' · <span style="color:var(--danger)">súbor sa neuložil</span>' : "");
  const g = el.querySelector("#syncGrantTop"); if (g) g.onclick = () => Sync.grant();
}

};
const P = () => S.p;
const projPath = id => "projects/" + id;
const itemPath = (pid, id) => "projects/" + pid + "/items/" + id;
const entPath = (pid, id) => "projects/" + pid + "/ents/" + id;
function saveProject() { const p = S.p; if (!p) return; p.updated = Date.now(); p.words = totalWords(); p.entCount = Object.keys(S.ents).length; touchDaily(); const id = p.id; qset(projPath(id), () => (S.p && S.p.id === id ? projDoc(S.p) : null)); }
function projDoc(p) { const { id, ...rest } = p; return clone(rest); }
function saveItem(id) { const pid = S.p.id; qset(itemPath(pid, id), () => { const it = S.items[id]; return it ? { html: it.html || "", notes: it.notes || "" } : null; }); }
function saveEnt(id) { const pid = S.p.id; qset(entPath(pid, id), () => { const e = S.ents[id]; if (!e) return null; const { id: _x, ...r } = e; return clone(r); }); saveProject(); }

/* tree helpers */
function walk(nodes, fn, parent = null, depth = 0) { for (let i = 0; i < nodes.length; i++) { const n = nodes[i]; if (fn(n, parent, i, depth) === false) return false; if (n.children && walk(n.children, fn, n, depth + 1) === false) return false; } }
function findNode(id) { let r = null; walk(S.p.binder, (n, par, i) => { if (n.id === id) { r = { n, parent: par, i, list: par ? par.children : S.p.binder }; return false; } }); return r; }
function allTexts(nodes = S.p.binder, acc = []) { for (const n of nodes) { if (n.type === "text") acc.push(n); if (n.children) allTexts(n.children, acc); } return acc; }
function nodeWords(n) { if (n.type === "text") return n.words || 0; return (n.children || []).reduce((a, c) => a + nodeWords(c), 0); }
function nodeChars(n) { if (n.type === "text") return n.chars ?? (n.chars = countChars(S.items[n.id]?.html)); return (n.children || []).reduce((a, c) => a + nodeChars(c), 0); }
function totalChars() { return S.p ? S.p.binder.reduce((a, n) => a + nodeChars(n), 0) : 0; }
function totalWords() { return S.p ? S.p.binder.reduce((a, n) => a + nodeWords(n), 0) : 0; }
function isAncestor(aId, bId) { const a = findNode(aId); if (!a) return false; let hit = false; walk(a.n.children || [], n => { if (n.id === bId) { hit = true; return false; } }); return hit; }
function entsBy(cat) { return Object.values(S.ents).filter(e => !cat || cat === "all" || e.cat === cat).sort((a, b) => a.name.localeCompare(b.name, "sk")); }

function touchDaily() {
  const p = S.p, d = today(), tw = totalWords();
  if (!p.dayStart || p.dayStart.date !== d) p.dayStart = { date: d, words: tw };
  p.history = p.history || {};
  const w = Math.max(0, tw - p.dayStart.words);
  if ((p.history[d] || 0) !== w) {
    p.history[d] = w;
    const keys = Object.keys(p.history).sort(); while (keys.length > 90) delete p.history[keys.shift()];
  }
}
