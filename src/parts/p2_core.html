const Store = {

          const id = await user.id();

  },
  lsKey: p => "kronikar:" + p,
  async get(path) {

  async del(path) {

    try { localStorage.removeItem(this.lsKey(path)); } catch { }

    try {
      if (job.del) { await Store.del(path); Q.last.delete(path); changed = true; }
      else {
        const d = job.getData();

          /* skip writes that change nothing (e.g. only clicking around) */

        }
      }
      Q.err = null;
    } catch (e) {

function nodeWords(n) { if (n.type === "text") return n.words || 0; return (n.children || []).reduce((a, c) => a + nodeWords(c), 0); }
function nodeChars(n) { if (n.type === "text") return n.chars ?? (n.chars = countChars(S.items[n.id]?.html)); return (n.children || []).reduce((a, c) => a + nodeChars(c), 0); }
function totalChars() { return S.p ? S.p.binder.reduce((a, n) => a + nodeChars(n), 0) : 0; }
function totalWords() { return S.p ? S.p.binder.reduce((a, n) => a + nodeWords(n), 0) : 0; }
function isAncestor(aId, bId) { const a = findNode(aId); if (!a) return false; let hit = false; walk(a.n.children || [], n => { if (n.id === bId) { hit = true; return false; } }); return hit; }
function entsBy(cat) { return Object.values(S.ents).filter(e => e && (!cat || cat === "all" || e.cat === cat)).sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "sk")); }

function touchDaily() {
  const p = S.p, d = today(), tw = totalWords();
  if (!p.dayStart || p.dayStart.date !== d) p.dayStart = { date: d, words: tw };
  p.history = p.history || {};
  const w = Math.max(0, tw - p.dayStart.words);
  if ((p.history[d] || 0) !== w) {
    p.history[d] = w;
    const keys = Object.keys(p.history).sort(); while (keys.length > 90) delete p.history[keys.shift()];
  }
}

/* ---- 1.35: light / dark theme chosen in the app (per device), or following the system ---- */
const THEME = { get() { try { const v = localStorage.getItem("kronikar:theme"); return v === "light" || v === "dark" ? v : "auto"; } catch { return "auto"; } } };
function applyTheme(v) {
  v = v || THEME.get(); const r = document.documentElement;
  if (v === "auto") delete r.dataset.theme; else r.dataset.theme = v;
  const dark = v === "dark" || (v === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#101318" : "#2E6B66");
}
function setTheme(v) {
  try { if (v === "auto") localStorage.removeItem("kronikar:theme"); else localStorage.setItem("kronikar:theme", v); } catch { }
  applyTheme(v);
  if (typeof render === "function") render();
}
const THEME_NAMES = { auto: "Podľa systému", light: "Svetlý", dark: "Tmavý" };
function themeIcon(v) { v = v || THEME.get(); return v === "dark" ? '<svg viewBox="0 0 16 16"><path d="M13.3 10.1A5.6 5.6 0 0 1 5.9 2.7a5.6 5.6 0 1 0 7.4 7.4z" fill="currentColor"/></svg>' : v === "light" ? '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>' : '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor"/></svg>'; }
function themeBtnHtml() { const v = THEME.get(); return `<button class="btn icon ghost tb-refresh" id="tbTheme" title="${esc(tl("Motív"))}: ${esc(tl(THEME_NAMES[v]))}" aria-label="${esc(tl("Motív"))}: ${esc(tl(THEME_NAMES[v]))}">${themeIcon(v)}</button>`; }
function bindThemeBtn() { const b = document.getElementById("tbTheme"); if (!b) return; b.onclick = () => { const order = ["auto", "light", "dark"], v = order[(order.indexOf(THEME.get()) + 1) % 3]; setTheme(v); toast(tl("Motív") + ": " + tl(THEME_NAMES[v])); }; }
try { window.matchMedia && matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme()); } catch { }
applyTheme();
</script>
