/* ================= 1. search everywhere (Ctrl+K) ================= */

}
function openSearch() {

    $$("[data-ks]", box).forEach(b => b.onclick = () => pick(+b.dataset.ks));
  };
  const pick = i => { const r = res[i]; if (!r) return; m.close(); r.go(); };
  inp.oninput = debounce(() => { KS.i = 0; draw(); }, 120);
  inp.onkeydown = ev => {
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); KS.i = Math.max(0, Math.min(res.length - 1, KS.i + (ev.key === "ArrowDown" ? 1 : -1))); $$("[data-ks]", box).forEach(b => b.classList.toggle("on", +b.dataset.ks === KS.i)); $(`[data-ks="${KS.i}"]`, box)?.scrollIntoView({ block: "nearest" }); }
    else if (ev.key === "Enter") { ev.preventDefault(); pick(KS.i); }

document.addEventListener("keydown", ev => { if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && (ev.key === "k" || ev.key === "K") && S.p && S.view !== "home") { ev.preventDefault(); openSearch(); } });

/* ================= 2. appearance of characters found in the text ================= */
const LOOK_PARTS = [
  ["oci", "Oči", "oci oc ocami ociach ociam oko oka oku okom"],
  ["vlasy", "Vlasy", "vlasy vlasov vlasmi vlasoch vlasom vlas kadere kader kaderami hriva hrivu hrivou hrivy vrkoc vrkoce vrkocom vrkocmi kucery kucerami"],
  ["plet", "Pleť", "plet pleti pletou"],
  ["tvar", "Tvár", "tvar tvare tvari tvarou lica licami"],
  ["brada", "Brada a fúzy", "brada bradu brady brade bradou fuzy fuzov fuzmi briadka briadku briadkou"],
  ["hlas", "Hlas", "hlas hlasu hlasom hlase"],
  ["ruky", "Ruky", "ruky ruke rukou rukami rukach dlane dlanami dlanou prsty prstami"],

/* quick test: does a sentence contain any appearance word or build adjective at all */
const LOOK_QUICK = new RegExp("(?<![\\p{L}])(?:" + LOOK_PARTS.flatMap(p => p[2].split(" ")).join("|") + "|stihl|vysok|nizk|chud|mohutn|statn|zavalit|svalnat|shrben|krehk|drobn)", "u");
const LOOK_WORDS = new Map(); LOOK_PARTS.forEach(([k, , w]) => w.split(" ").forEach(x => LOOK_WORDS.set(x, k)));
const LOOK_COLORS = [["sivé", "siv sed popolav ocelov"], ["zelené", "zelen smaragd olivov"], ["modré", "modr blankyt azur nebesk"], ["hnedé", "hned gastan orieskov kastan medov"], ["čierne", "ciern havran uhlov smoln"], ["biele", "biel snehov mliecn"], ["ryšavé", "rysav cerven medn hrdzav"], ["plavé", "plav zlat slamov psenicn"], ["strieborné", "striebor sediv sedin"], ["jantárové", "jantar"], ["fialové", "fialov"]];
const LOOK_OTHER = "dlh kratk kucerav vlnit hust riedk ostrih zapleten rozpusten zacesan sikm uzk sirok velk drobn hlbok svetl tmav bled opalen sned vraskav hladk jemn hrub chraplav zvonk mozolnat stihl vysok nizk chud mohutn statn zavalit svalnat shrben krehk ostr okruhl hranat kriv zlomen pehav prenikav bystr spalen pobozn zjazven tetovan".split(" ");
const LOOK_BUILD = "stihl vysok nizk chud mohutn statn zavalit svalnat shrben krehk drobn".split(" ");
const COPULA = new Set("bol bola bolo boli je su vyzeral vyzerala posobil posobila".split(" "));
function lookAttr(tok) {
  for (const [c, st] of LOOK_COLORS) if (st.split(" ").some(s => tok.startsWith(s))) return { c, color: true };
  const o = LOOK_OTHER.find(s => tok.startsWith(s) && tok.length > s.length - 1); return o ? { c: tok, color: false } : null;
}
/* the "given name" of a character: the longest capitalised word that is not a title */
const LOOK_TITLES = /^(brat|sestra|kral|kralovna|princ|princezna|pan|pani|majster|lord|lady|otec|matka|svaty|svata|velmajster|knaz|knazka|z|zo|od|von|van|de)$/;
const lookStems = name => [...new Set(norm(name || "").split(/[\s,]+/).filter(w => w.length > 2 && !LOOK_TITLES.test(w)).map(w => w.length > 4 ? w.replace(/(ova|a|e|i|o|u|y)$/, "") : w.length > 3 ? w.replace(/[aeiouy]$/, "") : w).filter(w => w.length > 2))];
function lookTokens(s) { const out = []; const re = /[\p{L}]+/gu; let m; while ((m = re.exec(s))) out.push({ w: m[0], a: m.index }); return out; }
function scanLooks() {
  const chars = entsBy("postava").filter(c => lookStems(c.name).length).map(c => { const st = "(?:" + lookStems(c.name).join("|") + ")"; return { c, re: termRegex(entTerms(c)), pos: new RegExp("^" + st + "(in|ina|ine|inu|inho|inej|inom|inych|ov|ova|ove|ovu|ovho|ovej|ovom|ovych)$"), tok: new RegExp("^" + st + "(a|e|i|o|u|y|ou|om|ovi|ami)?$") }; });
  const res = {}; chars.forEach(x => res[x.c.id] = []);
  const ign = new Set(S.p.lookIgnore || []);
  allTexts().forEach(n => {
    const raw = textOf(S.items[n.id]?.html || "").raw.replace(/\s+/g, " "); if (!raw) return;
    const sents = raw.split(/(?<=[.!?…])\s+/); let prevSent = ""; const x0 = l => l.length === 1;

        } else if (LOOK_BUILD.some(s => t.w.startsWith(s)) && toks.slice(Math.max(0, i - 3), i).some(p => COPULA.has(p.w))) found.push({ part: "postava", i, attrs: [{ c: t.w, color: false, o: sent.slice(t.a, t.a + t.w.length).toLowerCase() }], w: t });
      });

const LOOK = { cache: null, at: 0 };
function looksKey() { return (S.textRev || 0) + "|" + (S.p.lookIgnore || []).length + "|" + entsBy("postava").map(c => c.id + c.name + (c.forms || []).join(",") + nicksOf(c).join(",")).join(";"); }

const PART_NAME = k => (LOOK_PARTS.find(p => p[0] === k) || [k, "Postava a výška"])[1];
const attrLabel = a => a.color ? a.c : a.c.replace(/(ymi|ymi|ych|eho|emu|ej|ou|ym|ym|im|e|a|y|i|u|o)$/, "") + "…";
function mountLooks(box, e) {
  if (!box) return; if (e.cat !== "postava") { box.remove(); return; }
  const rows = looksFor(e.id), parts = [...new Set(rows.map(r => r.part))];
  box.innerHTML = `<h3>${esc(tl("Vzhľad z textu"))} ${rows.length ? `<span class="mono" style="letter-spacing:0">${rows.length}</span>` : ""}<span class="spacer"></span><button class="btn sm ghost" id="lookRe">${I.refresh}${esc(tl("Prehľadať znova"))}</button></h3>

    ${list.length ? `<div class="cplot-track"><span class="ln"></span>${CPLOT_POS.map(([v, l]) => `<span class="cptk${v === 0 ? " f" : v === 100 ? " l" : ""}" style="left:${v}%">${esc(tl(l))}</span>`).join("")}${list.map(x => `<button class="mk${x.done ? " done" : ""}" data-cpm="${x.id}" style="left:${x.at ?? 50}%" title="${esc(x.t + " · " + cpPosLabel(x.at ?? 50) + (x.done ? " · " + tl("splnené") : ""))}"></button>`).join("")}</div>` : ""}
    <div class="cplot">${list.map(x => `<div class="cplot-row${x.done ? " done" : ""}" data-cp="${x.id}"><input type="checkbox" data-cpd${x.done ? " checked" : ""} title="${esc(tl("Splnené"))}" aria-label="${esc(tl("Splnené"))}"><input class="inp cp-t no-tr" data-cpt value="${esc(x.t)}"><label class="cp-pos"><input type="range" min="0" max="100" step="5" value="${x.at ?? 50}" data-cpa aria-label="${esc(tl("Kde v príbehu"))}"><small data-cpl>${esc(cpPosLabel(x.at ?? 50))}</small></label><button class="btn icon ghost sm" data-cprm aria-label="${esc(tl("Odobrať"))}">×</button>
      <div class="cp-x">${x.ch && findNode(x.ch) ? `<span class="chip"><button class="lnk" data-cpgo="${x.ch}">${I.doc} ${esc(evNodeLabel(x.ch))}</button><button class="x" data-cpchrm aria-label="${esc(tl("Odobrať"))}">×</button></span>` : `<select class="inp sm" data-cpch><option value="">${esc(tl("+ kapitola (voliteľné)…"))}</option>${evOptions()}</select>`}</div></div>`).join("")}</div>
    <div class="cplot-add"><input class="inp" id="cpNew" placeholder="${esc(tl("napr. Musí sa rozhodnúť, či zradí otca"))}" autocomplete="off"><select class="inp" id="cpNewAt">${CPLOT_POS.map(([v, l]) => `<option value="${v}"${v === 50 ? " selected" : ""}>${esc(tl(l))}</option>`).join("")}</select><button class="btn" id="cpAdd">${I.plus}${esc(tl("Pridať"))}</button></div>`;
  const sv = () => saveEnt(e.id), again = () => mountCharPlot(box, e), item = row => e.plot.find(x => x.id === row.dataset.cp);
  $$("[data-cp]", box).forEach(row => {
    const x = item(row);
    $("[data-cpd]", row).onchange = ev => { x.done = ev.target.checked || undefined; if (!x.done) delete x.done; sv(); again(); };
    $("[data-cpt]", row).oninput = debounce(ev => { x.t = ev.target.value; sv(); }, 300);
    const r = $("[data-cpa]", row); r.oninput = () => { x.at = +r.value; $("[data-cpl]", row).textContent = cpPosLabel(x.at); const mk = $(`[data-cpm="${x.id}"]`, box); if (mk) mk.style.left = x.at + "%"; }; r.onchange = () => { sv(); again(); };
    $("[data-cprm]", row).onclick = () => { e.plot = e.plot.filter(y => y !== x); sv(); again(); };
    $("[data-cpch]", row)?.addEventListener("change", ev => { if (ev.target.value) { x.ch = ev.target.value; sv(); again(); } });
    $("[data-cpchrm]", row)?.addEventListener("click", () => { delete x.ch; sv(); again(); });
    $("[data-cpgo]", row)?.addEventListener("click", () => goNode(x.ch));
  });
  $$("[data-cpm]", box).forEach(m => m.onclick = () => { const row = $(`[data-cp="${m.dataset.cpm}"]`, box); row?.scrollIntoView({ block: "nearest", behavior: "smooth" }); $("[data-cpt]", row)?.focus(); });
  const add = () => { const t = $("#cpNew", box).value.trim(); if (!t) { $("#cpNew", box).focus(); return; } e.plot.push({ id: uid("cp"), t, at: +$("#cpNewAt", box).value }); sv(); again(); setTimeout(() => $("#cpNew", box)?.focus(), 30); };
  $("#cpAdd", box).onclick = add; $("#cpNew", box).onkeydown = ev => { if (ev.key === "Enter") add(); };
}

/* ================= consulting: export one chapter / scene / part, or every chapter separately ================= */
function chapterText(numbered) {
  const out = [], struct = bookStructure();
  struct.forEach(s => {
    if (s.type === "part") { out.push(partLabel(s.n).toUpperCase() + (s.title ? ": " + s.title : ""), ""); return; }
    if (!s.loose) out.push((chapLabel(s.n) ? chapLabel(s.n) + ": " : "") + (s.title || ""), "");
    let pn = 0; const cn = s.loose ? roman(s.part) : s.n;
    s.texts.forEach((tx, i) => { if (i) out.push("* * *", ""); const d = new DOMParser().parseFromString("<div>" + exportHtml(S.items[tx.id]?.html || "") + "</div>", "text/html");
      [...d.body.firstChild.childNodes].forEach(p => { const t = (p.textContent || "").replace(/\s+/g, " ").trim(); if (t) out.push((numbered ? cn + "." + (++pn) + " " : "") + t); }); out.push(""); });
  });
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
}
async function buildOnly(id, fmt, numbered) {
  const prev = S.exportOnly; S.exportOnly = id;
  try {
    if (!bookStructure().length) throw new Error(tl("V tejto časti nie je nič na export (alebo nie je zahrnutá do exportu)."));
    if (fmt === "txt") return new Blob([chapterText(numbered)], { type: "text/plain;charset=utf-8" });
    const mode = numbered ? "beta" : "text";
    return fmt === "pdf" ? await buildPdf(mode) : await buildDocx(mode);
  } finally { if (prev) S.exportOnly = prev; else delete S.exportOnly; }
}
const EXT = { pdf: [".pdf", "application/pdf"], docx: [".docx", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"], txt: [".txt", "text/plain"] };
async function exportNode(id, fmt, numbered, btn) {
  const n = findNode(id)?.n; if (!n) return; if (btn) btn.disabled = true;
  try { const blob = await buildOnly(id, fmt, numbered); await saveFile(slug((S.p.title || "kniha") + "-" + (n.title || "kapitola")) + (numbered ? "-ocislovane" : "") + EXT[fmt][0], blob, EXT[fmt][1]); }
  catch (err) { console.error(err); toast(tl("Nepodarilo sa: {x}", err.message || err)); }
  finally { if (btn) btn.disabled = false; }
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch { }
  try { const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch { return false; }
}
async function copyNode(id, numbered) { const prev = S.exportOnly; S.exportOnly = id; try { const t = chapterText(numbered); const ok = await copyText(t); toast(ok ? tl("Skopírované – {x} slov. Môžeš to vložiť do správy alebo e-mailu.", nf(countWords(t))) : tl("Kopírovanie sa nepodarilo.")); } finally { if (prev) S.exportOnly = prev; else delete S.exportOnly; } }
async function exportEachChapter(fmt, numbered, onStep) {
  const chs = bookStructure().filter(s => s.type === "chapter" && !s.loose), files = [];
  for (let i = 0; i < chs.length; i++) {
    const s = chs[i]; onStep && onStep(i + 1, chs.length);
    const blob = await buildOnly(s.node.id, fmt, numbered);
    files.push({ name: String(s.n).padStart(2, "0") + "-" + slug(s.title || "kapitola") + EXT[fmt][0], data: new Uint8Array(await blob.arrayBuffer()) });
  }
  if (!files.length) throw new Error(tl("Rukopis je zatiaľ prázdny."));
  const zip = zipStore(files);
  await saveFile(slug(S.p.title || "kniha") + "-po-kapitolach" + (numbered ? "-ocislovane" : "") + ".zip", new Blob([zip], { type: "application/zip" }), "application/zip");
}
function consultHtml(n) {
  const what = n.type === "text" ? tl("túto scénu") : n.kind === "part" ? tl("túto časť") : tl("túto kapitolu");
  return `<span class="lbl">${esc(tl("Na konzultáciu"))}</span><span class="hint">${esc(tl("Stiahni alebo skopíruj len {x} – napríklad pre redaktora, beta čitateľa alebo na poradu.", what))}</span>
    <label class="chk"><input type="checkbox" id="cnNum"${S.consultNum ? " checked" : ""}> ${esc(tl("s číslami odsekov (na pripomienky)"))}</label>
    <div class="btnrow"><button class="btn sm" data-cn="pdf">${I.dl}PDF</button><button class="btn sm" data-cn="docx">${I.dl}Word</button><button class="btn sm" data-cn="txt">${I.dl}${esc(tl("Text"))}</button><button class="btn sm" data-cn="copy">${esc(tl("Kopírovať"))}</button></div>`;
}
function bindConsult(box, n) {
  $("#cnNum", box).onchange = ev => { S.consultNum = ev.target.checked; };
  $$("[data-cn]", box).forEach(b => b.onclick = () => { if (typeof flushEditor === "function") flushEditor(); const num = !!S.consultNum; if (b.dataset.cn === "copy") copyNode(n.id, num); else exportNode(n.id, b.dataset.cn, num, b); });
}

/* ================= order of the sections in a World entry, per category (S.p.cardOrder[cat] = {order: [keys], hidden: [keys]}) ================= */
const CARD_NAMES = { mapa: "Mapa", namape: "Na mape", vlastnosti: "Vlastnosti", prudy: "Magické prúdy", vzhlad: "Vzhľad z textu", lepiky: "Lepiace poznámky", foto: "Fotografie", linia: "Dejová línia postavy", oblk: "Oblúk postavy", cas: "Na časovej osi", dejiny: "Dejiny miesta", prepojenia: "Prepojenia", tvary: "Tvary mena a prezývky", odkazy: "Odkazy", poznamky: "Poznámky", rukopis: "V rukopise" };
function applyCardOrder(el, e) {
  const conf = (S.p.cardOrder || {})[e.cat]; const cards = $$(".card[data-card]", el); if (!cards.length) return;
  const hidden = new Set(conf?.hidden || []); cards.forEach(c => c.classList.toggle("cardoff", hidden.has(c.dataset.card)));
  if (!conf || !conf.order) return;
  const parent = cards[0].parentNode, anchor = cards[cards.length - 1].nextSibling, by = Object.fromEntries(cards.map(c => [c.dataset.card, c]));
  const order = [...conf.order.filter(k => by[k]), ...cards.map(c => c.dataset.card).filter(k => !conf.order.includes(k))];
  order.forEach(k => parent.insertBefore(by[k], anchor));
}
function openCardOrder(el, e) {
  const conf = (S.p.cardOrder || {})[e.cat] || {}, present = $$(".card[data-card]", el).map(c => c.dataset.card);
  let order = [...(conf.order || []).filter(k => present.includes(k)), ...present.filter(k => !(conf.order || []).includes(k))];
  const hidden = new Set(conf.hidden || []);
  const m = modal(`<div class="rt-h"><h3>${esc(tl("Poradie častí"))} · ${esc(CAT[e.cat]?.name || "")}</h3><button class="btn icon ghost" data-close aria-label="${esc(tl("Zavrieť"))}">×</button></div>
    <p class="hint">${esc(tl("Poradie a viditeľnosť platia pre všetky záznamy v tejto kategórii. Potiahni riadok alebo použi šípky; odškrtnutím časť skryješ."))}</p><div class="co-list" id="coList"></div>
    <div class="btnrow"><button class="btn primary" id="coSave">${esc(tl("Uložiť"))}</button><button class="btn ghost" id="coReset">${esc(tl("Pôvodné poradie"))}</button><span class="spacer"></span><button class="btn" data-close>${esc(tl("Zrušiť"))}</button></div>`, "reltypes");
  const list = $("#coList", m.el);
  const draw = () => {
    list.innerHTML = order.map((k, i) => `<div class="co-row${hidden.has(k) ? " off" : ""}" draggable="true" data-k="${k}"><span class="co-grip" aria-hidden="true">⋮⋮</span><label class="chk"><input type="checkbox" data-cov${hidden.has(k) ? "" : " checked"}> ${esc(tl(CARD_NAMES[k] || k))}</label><span class="spacer"></span><button class="btn icon ghost sm" data-cu${i ? "" : " disabled"} aria-label="${esc(tl("Vyššie"))}">${I.up}</button><button class="btn icon ghost sm" data-cd${i < order.length - 1 ? "" : " disabled"} aria-label="${esc(tl("Nižšie"))}">${I.down}</button></div>`).join("");
    $$(".co-row", list).forEach(row => {
      const k = row.dataset.k, i = order.indexOf(k);
      $("[data-cov]", row).onchange = ev => { if (ev.target.checked) hidden.delete(k); else hidden.add(k); row.classList.toggle("off", !ev.target.checked); };
      $("[data-cu]", row).onclick = () => { order.splice(i, 1); order.splice(i - 1, 0, k); draw(); };
      $("[data-cd]", row).onclick = () => { order.splice(i, 1); order.splice(i + 1, 0, k); draw(); };
      row.ondragstart = ev => { ev.dataTransfer.setData("text/plain", k); row.classList.add("drag"); };
      row.ondragend = () => row.classList.remove("drag");
      row.ondragover = ev => { ev.preventDefault(); row.classList.add("over"); };
      row.ondragleave = () => row.classList.remove("over");
      row.ondrop = ev => { ev.preventDefault(); const from = ev.dataTransfer.getData("text/plain"); if (!from || from === k) return; order.splice(order.indexOf(from), 1); order.splice(order.indexOf(k), 0, from); draw(); };
    });
  };
  draw();
  $("#coSave", m.el).onclick = () => { S.p.cardOrder = Object.assign({}, S.p.cardOrder, { [e.cat]: { order, hidden: [...hidden] } }); saveProject(); m.close(); renderEDetail(); toast(tl("Poradie uložené pre celú kategóriu.")); };
  $("#coReset", m.el).onclick = () => { const co = Object.assign({}, S.p.cardOrder); delete co[e.cat]; S.p.cardOrder = co; saveProject(); m.close(); renderEDetail(); toast(tl("Obnovené pôvodné poradie.")); };
}
